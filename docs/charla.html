<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K-7 &middot; Una charla</title>
<link rel="icon" href="img/logo-icono.svg" type="image/svg+xml">
<style>
  :root{
    --ink:#5c4a3a;            /* texto de la caja, marrón cálido */
    --ink-soft:#9a8977;
    --paper:#fdf7e3;          /* crema de la caja */
    --paper-2:#f4ead0;
    --tag:#e8963c;            /* naranja de la etiqueta */
    --hl:#e7448c;             /* resalte magenta */
    --hl2:#7bb03a;            /* resalte verde */
    --navy:#27344a;           /* tinta del visor */
    --paper-bg:#eef1f6;       /* fondo claro del visor */
    --blue:#50aed8;           /* azul de la paleta de K-7 (paleta 3) */
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:ui-rounded,"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
    background:radial-gradient(120% 100% at 50% 0%,#fdfdff 0%,var(--paper-bg) 55%,#dfe5ee 100%);
    color:var(--navy);overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #app{position:fixed;inset:0}
  canvas{display:block}

  /* ------------------------------------------------------------------ HUD */
  #hud{
    position:fixed;inset:auto 0 0 0;z-index:5;
    display:flex;justify-content:center;
    padding:0 clamp(12px,4vw,40px) clamp(16px,4vh,44px);
    pointer-events:none;
  }
  #box-wrap{
    width:min(860px,100%);position:relative;pointer-events:auto;
    transition:transform .3s ease;
  }
  /* el mensaje entero -etiqueta incluida, que si no se queda tapando la
     imagen- baja fuera de la vista; el botoncito vive fuera de box-wrap,
     así que no se mueve con él y sigue a mano para volver a subirlo */
  #box-wrap.peek{transform:translateY(160%)}

  #nametag{
    position:relative;left:clamp(6px,2vw,26px);bottom:-10px;
    display:inline-block;padding:7px 26px;border-radius:999px;
    background:var(--tag);color:#fff;font-weight:800;font-size:clamp(14px,2vw,18px);
    letter-spacing:.01em;box-shadow:0 3px 0 rgba(0,0,0,.18);
    border:3px solid rgba(255,255,255,.85);
  }
  #nametag.hidden{visibility:hidden}
  /* la profe Vero tiene su propio color de etiqueta, ademas de su modelo 3D */
  #nametag.vero{background:var(--hl)}

  /* botón para bajar el mensaje un momento y ver la pizarra completa: fijo
     abajo a la derecha, fuera de box-wrap para no bajar junto con él */
  #peek-btn{
    display:none;position:fixed;right:clamp(16px,4vw,40px);bottom:clamp(16px,4vh,40px);
    z-index:6;width:60px;height:60px;border-radius:999px;pointer-events:auto;
    background:var(--blue);color:#fff;border:3px solid rgba(255,255,255,.85);
    box-shadow:0 4px 0 rgba(0,0,0,.18);font-size:26px;line-height:1;cursor:pointer;
    align-items:center;justify-content:center;
  }
  #peek-btn.on{display:flex}

  #box{
    position:relative;border-radius:34px;padding:clamp(20px,3vw,30px) clamp(22px,3.5vw,38px);
    background:linear-gradient(180deg,var(--paper) 0%,var(--paper-2) 100%);
    border:3px solid rgba(255,255,255,.9);
    box-shadow:0 14px 40px rgba(0,0,0,.45);
    color:var(--ink);
  }
  /* en pantallas bajas (celular en horizontal, iPhone SE/8...) un texto largo
     -mas una pregunta con 3 opciones- puede crecer mas que el hueco libre
     entre #avatars (arriba, fixed) y el borde inferior: sin tope, la caja
     sigue subiendo y termina tapada detras de #avatars, con el texto
     ilegible. Por altura de viewport, no de ancho: pasa igual en un celular
     angosto en vertical (alto de sobra) que en uno ancho en horizontal. */
  @media (max-height:650px){
    /* overflow-x:hidden explicito: si solo se fija overflow-y, la regla del
       spec que convierte el otro eje en "auto" hace aparecer una barra
       horizontal aunque nada se pase de ancho (basta 1px de redondeo) */
    #box{max-height:78vh;overflow-y:auto;overflow-x:hidden}
  }
  #text{
    font-size:clamp(17px,2.35vw,25px);line-height:1.5;font-weight:600;
    min-height:calc(3 * 1.5em);white-space:pre-wrap;
  }
  #text b{color:var(--hl)}
  #text i{font-style:normal;color:var(--hl2)}
  .caret{
    display:inline-block;width:.55em;height:1.05em;vertical-align:-.15em;
    background:var(--ink);opacity:.35;animation:blink .9s steps(1,end) infinite;
  }
  @keyframes blink{50%{opacity:0}}

  #next{
    position:absolute;left:50%;bottom:10px;transform:translateX(-50%);
    width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;
    border-top:12px solid var(--tag);opacity:0;transition:opacity .2s;
    animation:bob 1s ease-in-out infinite;
  }
  #next.on{opacity:1}
  @keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,5px)}}

  /* --------------------------------------------------------------- opciones */
  #choices{display:none;flex-direction:column;gap:9px;margin-top:18px}
  #choices.on{display:flex}
  .choice{
    text-align:left;font:inherit;font-size:clamp(14px,1.7vw,18px);font-weight:650;
    color:var(--ink);background:#fffdf4;border:2px solid rgba(92,74,58,.16);
    border-radius:18px;padding:12px 18px;cursor:pointer;
    transition:transform .12s,border-color .12s,background .12s;
  }
  .choice:hover{transform:translateX(6px);border-color:var(--tag);background:#fff}
  .choice::before{content:"▸ ";color:var(--tag)}

  /* ----------------------------------------------------------------- input */
  #form{display:none;gap:10px;margin-top:18px}
  #form.on{display:flex}
  #entry{
    flex:1;font:inherit;font-size:clamp(15px,1.8vw,19px);font-weight:600;color:var(--ink);
    background:#fffdf4;border:2px solid rgba(92,74,58,.16);border-radius:18px;
    padding:12px 18px;outline:none;
  }
  #entry:focus{border-color:var(--tag)}
  #send{
    font:inherit;font-size:clamp(14px,1.7vw,18px);font-weight:800;color:#fff;
    background:var(--tag);border:0;border-radius:18px;padding:12px 26px;cursor:pointer;
  }
  #send:hover{filter:brightness(1.06)}

  /* ------------------------------------------------------------- capítulos */
  #chapter{
    position:fixed;inset:0;z-index:8;display:none;
    place-content:center;justify-items:center;gap:14px;text-align:center;
    background:rgba(238,241,246,.94);backdrop-filter:blur(6px);padding:30px;
  }
  #chapter.on{display:grid}
  #chapter h2{
    margin:0;font-size:clamp(26px,5vw,46px);font-weight:800;letter-spacing:-.02em;
    color:var(--navy);
  }
  #chapter p{
    margin:0;max-width:44ch;font-size:clamp(14px,2vw,18px);line-height:1.6;
    color:rgba(39,52,74,.62);font-weight:500;
  }
  #chapter small{color:rgba(39,52,74,.38);font-size:13px;margin-top:8px}

  /* ------------------------------------------------------------------ misc */
  #avatars{
    position:fixed;top:18px;right:20px;z-index:6;display:flex;align-items:center;gap:6px;
    padding:6px;border-radius:999px;background:rgba(255,255,255,.72);
    border:1px solid rgba(39,52,74,.10);box-shadow:0 6px 22px rgba(39,52,74,.13);
    backdrop-filter:blur(10px);
  }
  #avatars button{
    font:inherit;font-size:12px;font-weight:700;color:var(--navy);
    background:transparent;border:0;border-radius:999px;padding:7px 14px;cursor:pointer;
  }
  #avatars button[aria-pressed="true"]{background:var(--tag);color:#fff}
  #avatars .sep{width:1px;height:20px;background:rgba(39,52,74,.14);margin:0 2px}
  /* la paleta se elige solo por su muestrario: la barra ya va justa de sitio */
  #avatars button[data-pal]{padding:7px 9px}
  #avatars button[data-pal][aria-pressed="true"]{background:var(--navy)}
  .sw{display:flex;gap:2px}
  .sw i{width:6px;height:14px;border-radius:2px;background:var(--c)}
  #back{
    font-size:12px;font-weight:600;color:rgba(39,52,74,.5);
    text-decoration:none;padding:0 10px 0 4px;
  }
  #back:hover{color:var(--navy)}

  /* ------------------------------------------- botón e historial de charla */
  #log-btn{
    position:fixed;top:18px;left:20px;z-index:10;
    width:56px;height:44px;border:0;padding:0;cursor:pointer;
    background:rgba(255,255,255,.85);border-radius:16px 16px 16px 4px;
    box-shadow:0 6px 22px rgba(39,52,74,.16);
    display:grid;place-content:center;gap:4px;
    transition:transform .14s,background .14s;
  }
  #log-btn:hover{transform:translateY(-2px);background:#fff}
  #log-btn i{display:flex;gap:4px}
  #log-btn i b{width:6px;height:6px;border-radius:50%;background:var(--tag);display:block}
  #log-btn[aria-expanded="true"] i b{background:var(--hl)}
  #log-btn u{
    position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;
    border-radius:999px;background:var(--hl);color:#fff;text-decoration:none;
    font-size:11px;font-weight:800;line-height:20px;text-align:center;
  }
  #log-btn u:empty{display:none}

  #log{
    position:fixed;inset:0;z-index:9;display:none;
    /* sin backdrop-filter: Chrome no lo mezcla bien sobre el canvas WebGL */
    background:rgba(20,26,38,.62);
    overflow-y:auto;padding:86px clamp(14px,5vw,60px) 40px;
  }
  #log.on{display:block}
  #log-inner{width:min(820px,100%);margin:0 auto;display:flex;flex-direction:column;gap:12px}
  #log h3{
    margin:0 0 6px;font-size:13px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;color:rgba(255,255,255,.55);text-align:center;
  }
  .msg{
    max-width:72%;padding:13px 18px;font-size:clamp(14px,1.7vw,17px);line-height:1.5;
    font-weight:600;box-shadow:0 3px 14px rgba(0,0,0,.18);
  }
  .msg b{color:var(--hl)}
  .msg i{font-style:normal;color:var(--hl2)}
  .msg .from{
    display:block;font-size:11px;font-weight:800;letter-spacing:.06em;
    text-transform:uppercase;opacity:.5;margin-bottom:4px;
  }
  .msg.k7{
    align-self:flex-start;background:var(--paper);color:var(--ink);
    border-radius:18px 18px 18px 5px;
  }
  /* la profe Vero comparte burbuja con K-7, pero no su color */
  .msg.k7.vero{background:#fdeef5}
  /* la imagen de la pizarra queda también como un mensaje aparte, justo
     después del texto que la acompañó */
  .msg.img{max-width:88%}
  .msg.img img{display:block;width:100%;border-radius:14px;margin-top:6px}
  .msg.user{
    align-self:flex-end;background:#a8effd;color:#17495a;
    border-radius:18px 18px 5px 18px;
  }
  .msg.chapter{
    align-self:center;max-width:none;background:transparent;box-shadow:none;
    color:rgba(255,255,255,.65);font-size:12px;font-weight:800;
    letter-spacing:.1em;text-transform:uppercase;padding:6px 0;
  }
  #log-empty{
    color:rgba(255,255,255,.55);text-align:center;font-size:14px;
    font-weight:600;padding:40px 0;
  }

  #loader{
    position:fixed;inset:0;z-index:11;display:grid;place-content:center;gap:14px;
    justify-items:center;background:var(--paper-bg);color:rgba(39,52,74,.55);
    font-size:13px;transition:opacity .6s;
  }
  #loader.done{opacity:0;pointer-events:none}
  .bar{width:170px;height:4px;border-radius:2px;background:rgba(39,52,74,.12);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--tag);transition:width .2s}
  #err{
    position:fixed;inset:auto 20px 20px 20px;padding:14px 16px;border-radius:10px;
    background:#3b1220;color:#ffd9e4;font:12px/1.5 ui-monospace,monospace;
    white-space:pre-wrap;display:none;z-index:20;
  }

  /* --------------------------------------------------- pizarra (transición) */
  /* Cuando K-7 explica una actividad, la cámara hace zoom al tablero y ahí
     aparece la imagen, con un estallido de "tiza" al entrar y al salir. */
  #chalk{position:fixed;inset:0;z-index:4;pointer-events:none}
  #board-img{
    position:fixed;z-index:4;pointer-events:none;opacity:0;
    border-radius:6px;box-shadow:0 10px 34px rgba(0,0,0,.4);
    object-fit:contain;background:#fff;
    transition:opacity .32s ease;
  }
  @media (max-width:560px){
    #text{min-height:calc(4 * 1.5em)}
    /* de frente contra #log-btn (arriba a la izquierda): sin esto los seis
       botones en una sola fila se le montan encima */
    #avatars{
      max-width:calc(100vw - 96px);
      flex-wrap:wrap;justify-content:flex-end;row-gap:6px;
    }
    #avatars button{padding:6px 10px;font-size:11px}
    #avatars button[data-pal]{padding:6px 8px}
  }
</style>
</head>
<body>

<div id="app"></div>

<button id="log-btn" aria-expanded="false" title="Ver la conversación anterior">
  <i><b></b><b></b><b></b></i><u></u>
</button>

<div id="log">
  <div id="log-inner">
    <h3>lo que llevamos hablado</h3>
    <div id="log-empty">Todavía no hay mensajes anteriores.</div>
  </div>
</div>

<div id="avatars">
  <a id="back" href="./">← inicio</a>
  <button data-mesh="Modelo1" aria-pressed="true">Modelo 1</button>
  <button data-mesh="Modelo2" aria-pressed="false">Modelo 2</button>
  <button data-mesh="Modelo3" aria-pressed="false">Modelo 3</button>
  <span class="sep"></span>
  <button data-pal="uno" aria-pressed="true" title="Paleta 1">
    <span class="sw"><i style="--c:#f48dbd"></i><i style="--c:#cae376"></i><i style="--c:#a0cbdf"></i><i style="--c:#fbe05d"></i></span>
  </button>
  <button data-pal="dos" aria-pressed="false" title="Paleta 2">
    <span class="sw"><i style="--c:#ff5bff"></i><i style="--c:#4ef707"></i><i style="--c:#35bfff"></i><i style="--c:#fce907"></i></span>
  </button>
  <button data-pal="tres" aria-pressed="false" title="Paleta 3">
    <span class="sw"><i style="--c:#d852db"></i><i style="--c:#4fc180"></i><i style="--c:#50aed8"></i><i style="--c:#ead34e"></i></span>
  </button>
</div>

<button id="peek-btn" type="button" title="Bajar el mensaje para ver la pizarra">&#9662;</button>

<div id="hud">
  <div id="box-wrap">
    <div id="nametag">K-7</div>
    <div id="box">
      <div id="text"></div>
      <div id="choices"></div>
      <form id="form" autocomplete="off">
        <input id="entry" placeholder="Escriba aquí su respuesta…" maxlength="400">
        <button id="send" type="submit">Enviar</button>
      </form>
      <div id="next"></div>
    </div>
  </div>
</div>

<div id="chapter">
  <h2></h2>
  <p></p>
  <small>clic para continuar</small>
</div>

<canvas id="chalk"></canvas>
<img id="board-img" alt="">

<div id="loader"><div class="bar"><i></i></div><div id="loader-txt">encendiendo el escenario…</div></div>
<pre id="err"></pre>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';
import { K7, conectarBotones } from './character/k7.js';
import { Profesora } from './character/profesora.js';

const errBox = document.getElementById('err');
const fail = (m) => { errBox.style.display = 'block'; errBox.textContent += m + '\n'; };
window.addEventListener('error', e => fail(e.message));

/* ===================================================================== 3D */

const app = document.getElementById('app');
const scene = new THREE.Scene();

const FOV_K7 = 34;   // fov "normal", frente a K-7; el tablero puede ensancharlo (ver poseTablero)
const camera = new THREE.PerspectiveCamera(FOV_K7, innerWidth / innerHeight, 0.1, 100);
// toma frontal fija, como en Animal Crossing: nada de orbitar
const VIEW_DIR = new THREE.Vector3(0.16, 0.13, 1).normalize();
const TARGET = new THREE.Vector3(0, 1.0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

// misma luz del visor: fondo claro y sombra suave proyectada en el suelo
scene.add(new THREE.HemisphereLight(0xd8e4f5, 0x9aa6b8, 1.35));

const key = new THREE.DirectionalLight(0xffffff, 2.1);
key.position.set(1.8, 6.2, 2.2);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.radius = 3;
key.shadow.bias = -0.0012;
const s = key.shadow.camera;
// el volumen cubre tambien los muebles del fondo, no solo a K-7: justo lo
// que ocupan, porque estirarlo de mas reparte los mismos texels en mas area
s.left = -5.0; s.right = 4.0; s.top = 5.0; s.bottom = -4.0; s.near = 0.5; s.far = 18;
scene.add(key);

const fill = new THREE.DirectionalLight(0xcfe0ff, 0.55);
fill.position.set(-3.5, 1.6, 2.2);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 0.45);
rim.position.set(0, 2.4, -4.0);
scene.add(rim);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(6.5, 64).rotateX(-Math.PI / 2),
  new THREE.ShadowMaterial({ opacity: 0.20 })
);
ground.receiveShadow = true;
scene.add(ground);

/* ------------------------------------------------------- K-7 habla ------ */
/* Modelos, boca/ojos intercambiables y paletas viven en character/k7.js,
   compartido con visor.html. Aqui solo se usa k7.hablar()/k7.bocaEnReposo
   para el lipsync y el cabeceo al hablar; ver character/README.md. */

const k7 = new K7({
  THREE, GLTFLoader, base: './character',
  onError: fail,
});

/* --------------------------------------------------- la profe Vero ------ */
/* Vero es la Profesora de character/profesora.js. No esta en escena desde el
   principio: entra caminando por la derecha en 1.5, cuando K-7 la anuncia
   (ver entrarProfesora y el nodo con `entra: true`). Hasta entonces el
   encuadre es solo de K-7. */

const profesora = new Profesora({
  THREE, GLTFLoader, base: './character',
  onError: fail,
});

// marcas de suelo. K-7 esta solo en el centro hasta que llega Vero; ahi se
// corre a la izquierda para hacerle sitio.
const K7_X_SOLO = 0;
const K7_X_DUO = -0.62;
const VERO_X = 0.80;
const VERO_X_FUERA = 3.6;      // fuera de cuadro por la derecha
const ENTRADA_MS = 3400;
// cuando ella llega, K-7 deja de mirar de frente y se gira hacia su lado: los
// dos quedan conversando en vez de ser dos figuras mirando al docente
const K7_GIRO_DUO = 24;        // grados

let veroEnEscena = false;      // ya entro (y por tanto el encuadre es de dos)
let k7BaseX = K7_X_SOLO;       // x "de reposo" de K-7, la que respetan los saltitos

// misma eleccion de paleta que en el visor: se comparte por localStorage.
// Vero se suma solo con la cara: sus ojos y su boca llevan los materiales de
// K-7, asi que los dos los tienen del mismo color en las tres paletas.
conectarBotones('#avatars button[data-pal]', (id) => {
  k7.aplicarPaletaPersonaje(id);
  profesora.aplicarPaletaCara(id);
});
const clock = new THREE.Clock();

const loaderEl  = document.getElementById('loader');
const loaderTxt = document.getElementById('loader-txt');
const barEl     = document.querySelector('.bar i');

const CENTER = new THREE.Vector3();   // centro real del modelo
let modelRadius = 1;

/* --------------------------------------------------- pizarra (transición) */
let camPoseK7 = null;      // pose "normal" frente a K-7, la que deja frame()
let inBoardView = false;   // true mientras la cámara mira al tablero
let boardBox = null;       // Box3 del Tablero en espacio mundo (no se mueve)

/* ------------------------------------------------------ muebles del fondo */
/* Los tres implementos salen de ImplementosFondo.blend con acabado de boceto:
   relleno blanco hueso y contorno oscuro horneado en la malla. Se reparten
   detrás de K-7, y su separación se recalcula en cada encuadre: en móvil el
   encuadre deja ver unas 3 unidades de ancho y en escritorio más del doble,
   así que con posiciones fijas o se salen de cuadro o se amontonan. */

const props = new THREE.Group();
props.visible = false;
scene.add(props);

// x se multiplica por la separación que quepa en pantalla; el resto es fijo
const MUEBLES = [
  { pieza: 'Tablero', x:  0.00, y: 0.62, z: -3.10, rot:   0, fijo: true },
  { pieza: 'Mesa',    x: -1.32, y: 0,    z: -1.55, rot:  18 },
  { pieza: 'Silla',   x: -1.94, y: 0,    z: -2.18, rot:  18 },
  { pieza: 'Mesa',    x:  1.46, y: 0,    z: -1.20, rot: -22 },
  { pieza: 'Silla',   x:  2.10, y: 0,    z: -1.85, rot: -22 },
  { pieza: 'Mesa',    x: -2.95, y: 0,    z: -3.30, rot:  12 },
  { pieza: 'Silla',   x: -3.55, y: 0,    z: -3.85, rot:  12 },
];

function repartirProps() {
  if (!props.children.length) return;
  const halfFov = THREE.MathUtils.degToRad(camera.fov * 0.5);
  // ancho visible a la profundidad media de los muebles (~1.8 detrás de K-7)
  const dist = camera.position.distanceTo(TARGET) + 1.8;
  const ancho = 2 * dist * Math.tan(halfFov) * camera.aspect;
  const sep = THREE.MathUtils.clamp(ancho / 5.6, 0.66, 1.2);
  for (const ob of props.children)
    ob.position.x = ob.userData.x * (ob.userData.fijo ? 1 : sep);
  props.visible = true;
}

// El personaje tiene que caber en el hueco libre entre la barra de arriba
// (avatares) y la caja de dialogo de abajo, centrado en ese hueco -no en la
// pantalla entera-. Antes se aproximaba con una fraccion fija de la pantalla
// (0.52/0.62 segun el alto) pensada de escritorio: en movil, angosto, la
// barra de arriba se parte en dos lineas y la caja mide menos, asi que esa
// fraccion se quedaba corta y el personaje quedaba con la cabeza pegada a
// los botones. Mide los dos huecos de verdad en vez de adivinarlos.
/* Centro y radio de lo que la cámara tiene que encuadrar: K-7 solo, o K-7 y
   Vero juntos una vez ella entra. Vero se mide SIEMPRE en su marca final, no
   donde esté en ese instante: durante la entrada viene desde fuera de cuadro
   y el encuadre saldría absurdamente abierto. */
function medirElenco() {
  if (!k7.model) return;
  const box = new THREE.Box3().setFromObject(k7.model);

  if (veroEnEscena && profesora.model) {
    const x = profesora.model.position.x;
    const ry = profesora.model.rotation.y;
    profesora.model.position.x = VERO_X;
    profesora.model.rotation.y = 0;
    profesora.model.updateMatrixWorld(true);
    box.expandByObject(profesora.model);
    profesora.model.position.x = x;
    profesora.model.rotation.y = ry;
    profesora.model.updateMatrixWorld(true);
  }

  box.getCenter(CENTER);
  const size = box.getSize(new THREE.Vector3());
  modelRadius = Math.max(size.x, size.y, size.z) * 0.5;
}

function frame() {
  medirElenco();
  // si la cámara está mirando al tablero (ver pizarra más abajo), esta llamada
  // solo debe refrescar camPoseK7 para cuando se vuelva; no debe mover la
  // cámara que el docente tiene delante en ese momento
  const posarDespues = inBoardView ? { pos: camera.position.clone(), target: TARGET.clone(), fov: camera.fov } : null;

  // el tablero (ver poseTablero) puede dejar el fov ensanchado: esta es la
  // pose "normal" frente a K-7, siempre con el fov base, sin importar cual
  // estuviera activo al llamar a frame() (p.ej. si se redimensiona la
  // ventana mientras se mira el tablero)
  camera.fov = FOV_K7;
  camera.updateProjectionMatrix();

  const arribaLibre = document.getElementById('avatars').getBoundingClientRect().bottom;
  const abajoLibre = document.getElementById('hud').getBoundingClientRect().top;
  const halfFov = THREE.MathUtils.degToRad(camera.fov * 0.5);

  const zoom = THREE.MathUtils.clamp((abajoLibre - arribaLibre) / innerHeight, 0.42, 0.68);
  const dist = modelRadius / Math.sin(halfFov) / zoom * 1.34;
  const visibleH = 2 * dist * Math.tan(halfFov);

  const centroHueco = (arribaLibre + abajoLibre) / 2;
  const bajar = (innerHeight / 2 - centroHueco) * (visibleH / innerHeight);

  TARGET.copy(CENTER);
  TARGET.y -= bajar;
  camera.position.copy(VIEW_DIR).multiplyScalar(dist).add(TARGET);
  camera.lookAt(TARGET);
  camPoseK7 = { pos: camera.position.clone(), target: TARGET.clone(), fov: FOV_K7 };

  if (posarDespues) {
    camera.position.copy(posarDespues.pos);
    TARGET.copy(posarDespues.target);
    camera.fov = posarDespues.fov;
    camera.updateProjectionMatrix();
    camera.lookAt(TARGET);
  }
  repartirProps();
}

function showMesh(name) {
  k7.mostrarModelo(name);
  for (const b of document.querySelectorAll('#avatars button[data-mesh]'))
    b.setAttribute('aria-pressed', b.dataset.mesh === name);
}

// se llama al final del modulo (ver el pie del archivo): start() necesita
// `script`, declarado mas abajo, y un await a mitad de archivo saltaria a esa
// linea antes de que el resto del modulo termine de correr
async function iniciarK7() {
  await k7.cargar({
    onProgress: (frac) => { barEl.style.width = (frac * 100) + '%'; },
  });

  if (!k7.model) {
    loaderTxt.textContent = 'no se pudo cargar el modelo — ¿estás sirviendo la carpeta por HTTP?';
  } else {
    k7.agregarA(scene);
    frame();

    showMesh(k7.modelo);
    start();
  }
  loaderEl.classList.add('done');
}

/* Vero se carga en segundo plano, como los muebles: no aparece hasta 1.5, así
   que no tiene por qué retrasar el arranque de la charla. */
profesora.cargar().then(() => {
  if (!profesora.model) return;
  profesora.agregarA(scene);
  profesora.aplicarPaletaCara(k7.paleta);   // la misma que tenga K-7
  profesora.model.visible = false;
  profesora.model.position.set(VERO_X_FUERA, 0, 0);
});

// el fondo se carga aparte y no bloquea el arranque de la charla
new GLTFLoader().load('implementos.glb', (gltf) => {
  gltf.scene.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = true;
    // no reciben sombra: están detrás de K-7 y nada les cae encima, así que
    // el muestreo PCF en sus 14 mallas no compraba nada
    o.receiveShadow = false;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) {
      // misma cáscara invertida que en el robot: solo se ve por delante
      if (/outline/i.test(m.name)) {
        m.side = THREE.FrontSide;
        m.polygonOffset = true;
        m.polygonOffsetFactor = 1;
      }
    }
  });

  for (const m of MUEBLES) {
    const base = gltf.scene.getObjectByName(m.pieza);
    if (!base) { fail('falta ' + m.pieza + ' en implementos.glb'); continue; }
    const ob = base.clone();       // el clon comparte geometría y material
    ob.position.set(m.x, m.y, m.z);
    ob.rotation.set(0, THREE.MathUtils.degToRad(m.rot), 0);
    ob.userData = { x: m.x, fijo: !!m.fijo };
    props.add(ob);
    // el Tablero es 'fijo' (su x no depende del ancho de pantalla): su caja
    // en espacio mundo no vuelve a cambiar, se puede medir una sola vez aquí
    if (m.pieza === 'Tablero') boardBox = new THREE.Box3().setFromObject(ob);
  }
  repartirProps();
}, undefined, (e) => fail('implementos.glb: ' + e.message));

for (const b of document.querySelectorAll('#avatars button[data-mesh]'))
  b.addEventListener('click', () => showMesh(b.dataset.mesh));

/* --------------------------------------------------- pizarra (transición) */
/* Cuando K-7 termina de explicar una actividad, la cámara deja de mirarlo a
   él y hace zoom al Tablero de implementos.glb; ahí "aparece" una imagen con
   un estallido de partículas de tiza, como si se hubiera rayado de golpe.
   Al avanzar el guion, el mismo camino se recorre en reversa. Todo vive aquí
   porque solo lo usa el guion (más abajo), nada del resto de la escena. */

const elChalk    = document.getElementById('chalk');
const elBoardImg = document.getElementById('board-img');
const ctxChalk   = elChalk.getContext('2d');

let camAnim = null;         // tween de cámara en curso, o null si no hay
let chalkParticles = [];    // partículas de tiza vivas
let pizarraActiva = false;  // la imagen está mostrándose (a la espera de un clic)
let pizarraAnimando = false; // zoom/estallido en curso: ignora clics

function resizeChalk() {
  elChalk.width = innerWidth * devicePixelRatio;
  elChalk.height = innerHeight * devicePixelRatio;
  elChalk.style.width = innerWidth + 'px';
  elChalk.style.height = innerHeight + 'px';
}
resizeChalk();

function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2; }

// mueve cámara+objetivo (y fov, si `to` trae uno) de donde están ahora hasta
// `to` en `dur` ms
function tweenCamera(to, dur, onDone) {
  camAnim = {
    t0: performance.now(), dur, onDone,
    from: { pos: camera.position.clone(), target: TARGET.clone(), fov: camera.fov },
    to: { fov: camera.fov, ...to },
  };
}

function esperar(ms) { return new Promise((r) => setTimeout(r, ms)); }

function easeOutCubic(t) { return 1 - (1 - t) ** 3; }

/* interpola una propiedad numérica de un objeto three (posición, rotación…)
   con requestAnimationFrame; devuelve una promesa que resuelve al terminar */
function tweenProp(obj, campo, hasta, dur, ease = easeOutCubic) {
  return new Promise((resolve) => {
    const desde = obj[campo];
    const t0 = performance.now();
    (function step() {
      const t = Math.min(1, (performance.now() - t0) / dur);
      obj[campo] = desde + (hasta - desde) * ease(t);
      if (t >= 1) { resolve(); return; }
      requestAnimationFrame(step);
    })();
  });
}

/* ------------------------------------------------- la entrada de Vero --- */
/* K-7 la anuncia («¡Buen día, profe Vero!») y ella entra caminando por la
   derecha. Mientras cruza: camina de perfil hacia donde va, K-7 se corre a la
   izquierda para hacerle sitio y la cámara se abre del encuadre de uno al de
   dos. Al llegar a su marca se gira hacia el docente y se queda en reposo. */
async function entrarProfesora() {
  if (veroEnEscena || !profesora.model) return;
  veroEnEscena = true;

  profesora.model.visible = true;
  profesora.model.position.set(VERO_X_FUERA, 0, 0);
  profesora.model.rotation.y = -Math.PI / 2;   // de perfil, mirando a -X
  profesora.reproducir('Profesora_Caminando', 0.2);

  // K-7 le hace sitio y ademas se gira hacia ella
  k7BaseX = K7_X_DUO;
  tweenProp(k7.model.position, 'x', K7_X_DUO, ENTRADA_MS * 0.75);
  tweenProp(k7.model.rotation, 'y', THREE.MathUtils.degToRad(K7_GIRO_DUO), ENTRADA_MS * 0.75);
  abrirEncuadre(ENTRADA_MS * 0.8);

  await tweenProp(profesora.model.position, 'x', VERO_X, ENTRADA_MS);
  await tweenProp(profesora.model.rotation, 'y', 0, 420);
  profesora.reproducir('Profesora_Idle', 0.35);
}

/* Vero se queda en escena hasta el final de la expedición: no se despide
   andando. Quien la retira es el cambio de expedición, y lo hace en seco —la
   tarjeta de capítulo ocupa toda la pantalla, así que el corte no se ve—.
   Vuelve a entrar más adelante, en el punto del guion que lo pida (otro nodo
   con `entra: true`), nunca desde el arranque de una expedición. */
function quitarProfesora() {
  if (!veroEnEscena || !profesora.model) return;
  profesora.model.visible = false;
  profesora.hablar(false);
  veroEnEscena = false;          // antes de reencuadrar: ya no cuenta en medirElenco

  k7BaseX = K7_X_SOLO;
  k7.model.position.x = K7_X_SOLO;
  k7.model.rotation.y = 0;       // vuelve a mirar de frente al docente
  frame();                       // reencuadre en seco, detrás de la tarjeta
}

/* Lleva la cámara del encuadre actual al que toca ahora (frame() ya sabe si
   el elenco es de uno o de dos), pero animada en vez de en seco. */
function abrirEncuadre(dur) {
  const desde = { pos: camera.position.clone(), target: TARGET.clone(), fov: camera.fov };
  frame();
  const hasta = { pos: camera.position.clone(), target: TARGET.clone(), fov: camera.fov };
  camera.position.copy(desde.pos);
  TARGET.copy(desde.target);
  camera.fov = desde.fov;
  camera.updateProjectionMatrix();
  tweenCamera(hasta, dur);
}

// pose frente al tablero: recalculada cada vez (el fov efectivo cambia con
// el aspect de la ventana), a diferencia de camPoseK7 que frame() ya cachea
//
// El tablero es bien apaisado (~2:1). En un celular en vertical el fov
// horizontal disponible es angosto, y pedirle a la cámara que retroceda lo
// suficiente para que ese ancho entre completo la mandaba tan atrás que
// terminaba detrás de K-7 -literalmente con K-7 de por medio, tapando el
// tablero-. La distancia ahora se fija solo por el alto (con el fov base:
// eso es lo que ya garantiza no pasarse de largo) y el ancho se resuelve
// ensanchando el fov en ese mismo punto, no alejando más la cámara. El
// sobrante vertical que deja un fov más ancho es solo un poco más de aula
// alrededor del tablero, nunca K-7 de por medio.
function poseTablero() {
  if (!boardBox) return null;
  const center = boardBox.getCenter(new THREE.Vector3());
  const size = boardBox.getSize(new THREE.Vector3());
  const dir = new THREE.Vector3(0.05, 0.05, 1).normalize();   // casi de frente
  const MARGEN = 1.25;   // para que el tablero no quede a ras del encuadre

  const halfFovV0 = THREE.MathUtils.degToRad(FOV_K7 * 0.5);
  const dist = (size.y * 0.5 * MARGEN) / Math.tan(halfFovV0);

  const halfFovHNecesario = Math.atan((size.x * 0.5 * MARGEN) / dist);
  const halfFovVNecesario = Math.atan(Math.tan(halfFovHNecesario) / camera.aspect);
  const fov = Math.min(100, Math.max(FOV_K7, THREE.MathUtils.radToDeg(halfFovVNecesario) * 2));

  return { pos: center.clone().addScaledVector(dir, dist), target: center.clone(), fov };
}

// rectángulo en píxeles que ocupa la cara visible del tablero, con la cámara
// ya en su pose actual — así se posiciona la imagen encima de él
function rectoTablero(pad = 0.10) {
  const anchoX = boardBox.max.x - boardBox.min.x, anchoY = boardBox.max.y - boardBox.min.y;
  const z = boardBox.max.z;   // cara que mira hacia K-7 / la cámara
  const a = new THREE.Vector3(boardBox.min.x + anchoX * pad, boardBox.min.y + anchoY * pad, z).project(camera);
  const b = new THREE.Vector3(boardBox.max.x - anchoX * pad, boardBox.max.y - anchoY * pad, z).project(camera);
  const xs = [a.x, b.x].map((x) => (x * 0.5 + 0.5) * innerWidth);
  const ys = [a.y, b.y].map((y) => (1 - (y * 0.5 + 0.5)) * innerHeight);
  const left = Math.min(...xs), top = Math.min(...ys);
  return { left, top, width: Math.max(...xs) - left, height: Math.max(...ys) - top };
}

function ponerRectoImg(r) {
  elBoardImg.style.left = r.left + 'px';
  elBoardImg.style.top = r.top + 'px';
  elBoardImg.style.width = r.width + 'px';
  elBoardImg.style.height = r.height + 'px';
}

// estalla un puñado de motas de tiza dentro de `rect`; en reversa salen con
// menos fuerza y hacia arriba, como si el borrador las levantara
function chalkBurst(rect, { reverse = false } = {}) {
  for (let i = 0; i < 70; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = reverse ? 15 + Math.random() * 30 : 40 + Math.random() * 90;
    chalkParticles.push({
      x: rect.left + Math.random() * rect.width,
      y: rect.top + Math.random() * rect.height,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd - (reverse ? 70 : 0),
      life: 0, dur: 0.45 + Math.random() * 0.35,
      r: 1.4 + Math.random() * 2.4,
    });
  }
}

function actualizarChalk(dt) {
  if (!chalkParticles.length) return;
  ctxChalk.clearRect(0, 0, elChalk.width, elChalk.height);
  ctxChalk.save();
  ctxChalk.scale(devicePixelRatio, devicePixelRatio);
  const vivas = [];
  for (const p of chalkParticles) {
    p.life += dt;
    if (p.life >= p.dur) continue;
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 55 * dt;
    ctxChalk.globalAlpha = (1 - p.life / p.dur) * 0.85;
    ctxChalk.fillStyle = '#f4f1e8';
    ctxChalk.beginPath();
    ctxChalk.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctxChalk.fill();
    vivas.push(p);
  }
  ctxChalk.restore();
  chalkParticles = vivas;
  if (!vivas.length) ctxChalk.clearRect(0, 0, elChalk.width, elChalk.height);
}

async function mostrarPizarra(src) {
  if (pizarraAnimando || pizarraActiva) return;
  const pose = poseTablero();
  if (!pose) return;   // implementos.glb no llegó a tiempo: sin pizarra, sin frenar el guion
  pizarraAnimando = true;
  inBoardView = true;
  await new Promise((res) => tweenCamera(pose, 900, res));
  const rect = rectoTablero();
  chalkBurst(rect);
  await esperar(260);
  elBoardImg.src = src;
  ponerRectoImg(rect);
  elBoardImg.style.opacity = '1';
  pizarraActiva = true;
  pizarraAnimando = false;
  elPeek.classList.add('on');

  // que quede también en el historial, como un mensaje aparte justo después
  // del texto que la mostró (por eso se adelanta el flushPending de aquí:
  // si no, el siguiente next() la pondría en el historial antes que la
  // imagen y quedarían al revés)
  flushPending();
  addEntry((pendingWho === V ? 'k7 vero' : 'k7') + ' img', `<img src="${src}" alt="">`, pendingWho);
}

async function ocultarPizarra() {
  if (pizarraAnimando || !pizarraActiva) return;
  pizarraAnimando = true;
  pizarraActiva = false;
  bajarMensaje(false);        // si se había bajado para mirar, que vuelva antes de cerrar
  elPeek.classList.remove('on');
  elBoardImg.style.opacity = '0';
  chalkBurst(rectoTablero(), { reverse: true });
  await esperar(280);
  await new Promise((res) => tweenCamera(camPoseK7, 900, res));
  inBoardView = false;
  pizarraAnimando = false;
}

// baja el mensaje -y su etiqueta- un momento para ver la pizarra completa;
// solo tiene sentido mientras la pizarra está activa
let mensajeBajado = false;
function bajarMensaje(bajar = !mensajeBajado) {
  mensajeBajado = bajar;
  elBoxWrap.classList.toggle('peek', mensajeBajado);
  elPeek.innerHTML = mensajeBajado ? '&#9652;' : '&#9662;';
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  resizeChalk();
  if (k7.model) frame();
  if (pizarraActiva) ponerRectoImg(rectoTablero());
});

renderer.setAnimationLoop(() => {
  // Tope al paso de tiempo: si el docente se va a otra pestaña, el navegador
  // congela el rAF y al volver getDelta() devuelve de golpe todo lo que pasó.
  // Sin tope, ese salto se come de una vez el gesto que estuviera sonando.
  const dt = Math.min(clock.getDelta(), 0.05);
  k7.actualizar(dt);
  if (veroEnEscena) profesora.actualizar(dt);
  actualizarChalk(dt);

  if (camAnim) {
    const t = Math.min(1, (performance.now() - camAnim.t0) / camAnim.dur);
    const e = easeInOutCubic(t);
    camera.position.lerpVectors(camAnim.from.pos, camAnim.to.pos, e);
    TARGET.lerpVectors(camAnim.from.target, camAnim.to.target, e);
    if (camAnim.from.fov !== camAnim.to.fov) {
      camera.fov = THREE.MathUtils.lerp(camAnim.from.fov, camAnim.to.fov, e);
      camera.updateProjectionMatrix();
    }
    if (t >= 1) { const done = camAnim.onDone; camAnim = null; done?.(); }
  } else {
    const t = performance.now() * 0.0004;
    // respiración mínima de cámara: la escena nunca queda del todo quieta
    camera.position.x += Math.sin(t) * 0.00035;
  }
  camera.lookAt(TARGET);
  renderer.render(scene, camera);
});

/* ================================================================ GUION */
/* El texto de K-7 y el de la profe Vero salen de personaje.md.
   Vero entra en escena en 1.5 (ver entrarProfesora): a partir de ahi los dos
   estan en pantalla y cada nodo mueve al que habla, dejando al otro
   escuchando en reposo. */

const K = 'K-7';
const V = 'Profe Vero';

let docente = 'Docente';              // nombre que el usuario declare
const dicho = {                       // lo que el docente va aportando
  presentacion: '',
  ajuste:       '',
  estudiantes:  '',
  rumbo:        '',
  reflexion:    '',
  dano:         ''
};

const say  = (text) => ({ who: K, text });
const vero = (text) => ({ who: V, text });
/* pregunta abierta: guarda lo escrito en dicho[campo] */
const ask  = (text, campo, placeholder) => ({ who: K, text, input: campo, placeholder });
/* pregunta cerrada: cada opción trae la réplica con la que K-7 la recibe */
const pick = (text, options) => ({ who: K, text, options });
/* botón de un solo camino: sirve de latido entre bloques */
const beat = (text, label) => ({ who: K, text, options: [{ label }] });
const dyn  = (fn) => ({ who: K, dynamic: fn });
/* emote condicional: K-7 se pone triste si el docente dejó ese campo en blanco */
const emoteSiSilencio = (campo) => () => (dicho[campo] ? null : 'K7_Triste');

/* dos saltitos seguidos, uno ladeado a cada lado: reutiliza la animación
   K7_Saltito tal cual (no hay clip mirrado) y le monta encima un pequeño
   desplazamiento lateral en X, a la izquierda la primera vez y a la derecha
   la segunda -como el cabeceo de hablar(), pero puntual y no cada fotograma */
function saltoLadeado(signo) {
  return new Promise((resolve) => {
    k7.reproducir('K7_Saltito');
    const clip = k7.actions['K7_Saltito']?.getClip();
    const dur = (clip ? clip.duration : 0.6) * 1000;
    const t0 = performance.now();
    const desplazar = signo * 0.16;
    (function step() {
      const t = Math.min(1, (performance.now() - t0) / dur);
      // el saltito se suma a donde esté K-7, que no siempre es el centro:
      // cuando llega Vero se corre a la izquierda (ver k7BaseX)
      k7.model.position.x = k7BaseX + Math.sin(t * Math.PI) * desplazar;
      if (t >= 1) { k7.model.position.x = k7BaseX; resolve(); return; }
      requestAnimationFrame(step);
    })();
  });
}
async function saltosProfe() {
  await saltoLadeado(-1);
  await saltoLadeado(1);
}

const script = [

  /* ============================================ EXPEDICIÓN 1 ============ */
  { chapter: 'Expedición 1 · La IA no sabe quién eres',
    note: 'K-7 tiene toda la información del mundo y ni una sola pista sobre tu salón. Empieza por ahí.' },

  /* --------------------------------------------------------------- 1.1 */
  say('Buenas tardes, profe. ¿Me conoce? Soy <b>K-7</b>.'),

  if (!dicho.presentacion) {

/* La burbuja solo habla por K-7. Lo que el docente elige o escribe no se le
   repite en pantalla: se guarda aquí, para poder releerlo cuando quiera. */

let pending = null;   // mensaje en pantalla; entra al historial al pasar
let pendingWho = K;   // quién lo dijo (K-7 o la profe Vero)

function addEntry(kind, html, quien) {
  const div = document.createElement('div');
  div.className = 'msg ' + kind;
  if (kind === 'chapter') div.textContent = html;
  else div.innerHTML = `<span class="from">${kind === 'user' ? docente : (quien || K)}</span>` + html;
  elLogIn.appendChild(div);
  elEmpty.style.display = 'none';
  const n = elLogIn.querySelectorAll('.msg').length;
  elBadge.textContent = n > 99 ? '99+' : String(n);
}

// el mensaje actual entra al historial solo cuando deja de ser el actual
function flushPending() {
  if (!pending) return;
  addEntry(pendingWho === V ? 'k7 vero' : 'k7', pending, pendingWho);
  pending = null;
}

const RITMO = 17;     // ms por letra

// escribe carácter a carácter respetando las etiquetas <b>/<i>
function typewrite(html, done) {
  cancelAnimationFrame(typing);
  // el mismo cierre se usa al terminar y al saltar el texto con un clic
  reveal = () => { reveal = null; done(); };
  const tokens = html.match(/<\/?[bi]>|[\s\S]/g) || [];

  // El texto y el cursor van en dos nodos fijos. Reescribir #text entero en
  // cada letra volvía a parsear la caja y creaba un cursor nuevo -con su
  // animación de parpadeo- sesenta veces por segundo.
  elText.textContent = '';
  const vista  = document.createElement('span');
  const cursor = document.createElement('span');
  cursor.className = 'caret';
  elText.append(vista, cursor);

  let i = 0;
  let texto = '';             // se acumula; antes se rehacía entero cada letra
  let cierre = '';            // etiquetas abiertas, cerradas para que el HTML valga
  let sobra = RITMO;          // arranca con la primera letra ya cumplida
  let antes = performance.now();

  /* Va al ritmo del pintado, no en un temporizador aparte: así se toca el DOM
     una vez por fotograma y no dos veces entre pintado y pintado. El reloj
     sigue siendo el de antes -una letra cada RITMO- y se le pone tope para que
     al volver de un parón no vuelque medio párrafo de golpe. */
  const step = () => {
    const ahora = performance.now();
    sobra = Math.min(sobra + (ahora - antes), RITMO * 4);
    antes = ahora;

    let pinta = false;
    while (sobra >= RITMO && i < tokens.length) {
      sobra -= RITMO;
      const tk = tokens[i++];
      texto += tk;
      // una etiqueta no pinta nada por sí sola: se apunta y no se toca el DOM
      if (tk[0] === '<') {
        if (tk[1] === '/') cierre = cierre.replace(tk, '');
        else cierre = '</' + tk[1] + '>' + cierre;
      } else pinta = true;
    }
    if (pinta) vista.innerHTML = texto + cierre;

    if (i >= tokens.length) {
      k7.hablar(false);
      profesora.hablar(false);
      elText.innerHTML = html;
      if (reveal) reveal();
      return;
    }
    typing = requestAnimationFrame(step);
  };
  step();                       // arranca sin esperar al primer fotograma
}

function nameOf(node) {
  return typeof node.who === 'function' ? node.who() : node.who;
}

function clearUI() {
  elChoice.className = '';
  elChoice.innerHTML = '';
  elForm.className = '';
  elNext.classList.remove('on');
  if (mensajeBajado) bajarMensaje(false);   // un nodo nuevo siempre entra con el mensaje visible
  cancelAnimationFrame(typing);
  k7.hablar(false);
  k7.bocaEnReposo = 'feliz';
  profesora.hablar(false);
  profesora.bocaEnReposo = 'feliz';
  reveal = null;
  waiting = false;
}

function next() {
  clearUI();
  flushPending();
  const node = queue.shift();
  if (!node) return;

  /* tarjeta de capítulo a pantalla completa */
  if (node.chapter) {
    // cambiar de expedición es lo que retira a Vero, y tras la tarjeta no se
    // ve el corte: si sigue en escena, se va aquí
    quitarProfesora();
    addEntry('chapter', node.chapter);
    elChap.querySelector('h2').textContent = node.chapter;
    elChap.querySelector('p').textContent = node.note || '';
    elChap.classList.add('on');
    const go = () => { elChap.classList.remove('on'); elChap.removeEventListener('click', go); next(); };
    elChap.addEventListener('click', go);
    return;
  }

  if (node.end) {
    elTag.classList.add('hidden');
    full = '';
    elText.innerHTML = '<span style="opacity:.5">Fin de la charla. Recargue la página para volver a empezar.</span>';
    return;
  }

  elTag.classList.remove('hidden');
  const quien = nameOf(node);
  elTag.textContent = quien;
  // cada quien con su color de etiqueta, ademas de su modelo en escena
  elTag.classList.toggle('vero', quien === V);
  full = node.dynamic ? node.dynamic() : node.text;
  pending = full;
  pendingWho = quien;

  // el que no habla se queda escuchando; el emote del nodo es de quien habla
  const hablaVero = quien === V;
  k7.hablar(!hablaVero);
  if (veroEnEscena) profesora.hablar(hablaVero);

  // el emote puede ser fijo o decidirse según lo que el docente haya escrito
  // (ver emoteSiSilencio); sin uno propio, el personaje vuelve a su reposo
  const emoteName = typeof node.emote === 'function' ? node.emote() : node.emote;
  if (hablaVero) {
    if (veroEnEscena) profesora.reproducir(emoteName || 'Profesora_Idle');
    // `reaccion` deja que K-7 conteste con un gesto a lo que ella dice, en
    // los puntos que lo piden; sin ella se queda escuchando en reposo
    k7.reproducir(node.reaccion || 'Idle');
  } else {
    if (node.saltosLaterales) saltosProfe();
    else k7.reproducir(emoteName || 'Idle');
    if (veroEnEscena) profesora.reproducir('Profesora_Idle');
  }

  // K-7 la anuncia y ella entra caminando mientras él termina la frase
  if (node.entra) entrarProfesora();

  typewrite(full, () => {
    // quien acaba de hablar se queda con cara de esperar respuesta
    const enEspera = (node.input || node.options) ? 'pensando' : 'feliz';
    if (hablaVero) profesora.bocaEnReposo = enEspera;
    else k7.bocaEnReposo = enEspera;
    if (node.input) {
      campoActivo = node.input;
      elEntry.placeholder = node.placeholder || 'Escriba aquí su respuesta…';
      elForm.classList.add('on');
      elEntry.focus();
    } else if (node.options) {
      elChoice.classList.add('on');
      for (const opt of node.options) {
        const b = document.createElement('button');
        b.className = 'choice';
        b.type = 'button';
        b.textContent = opt.label;
        b.addEventListener('click', () => {
          // K-7 asume la respuesta: no se le repite al docente en pantalla,
          // solo queda anotada en el historial
          flushPending();
          addEntry('user', escapeText(opt.label));
          // cada opción puede traer su propia réplica antes de seguir el guion
          if (opt.reply) queue.unshift({ who: node.who, text: opt.reply });
          next();
        });
        elChoice.appendChild(b);
      }
    } else {
      elNext.classList.add('on');
      waiting = true;
      // el texto de la actividad ya se leyó completo: ahora sí, zoom al tablero
      if (node.board) mostrarPizarra(node.board);
    }
  });
}

// un clic completa el texto; el siguiente avanza
function advance() {
  // con el mensaje bajado, cualquier clic en la escena lo vuelve a subir en
  // vez de avanzar el guion -así no se salta un diálogo sin querer
  if (mensajeBajado) { bajarMensaje(false); return; }
  if (elChap.classList.contains('on')) return;
  if (elChoice.classList.contains('on') || elForm.classList.contains('on')) return;
  if (elText.querySelector('.caret')) {
    // primer clic: completa el texto y muestra lo que tocara mostrar
    cancelAnimationFrame(typing);
    k7.hablar(false);
    elText.innerHTML = full;
    if (reveal) reveal();
    return;
  }
  if (waiting) {
    if (pizarraAnimando) return;               // zoom/estallido en curso: ignorar el clic
    // varios mensajes seguidos pueden compartir la misma pizarra (board/boardHold):
    // solo se cierra cuando el siguiente nodo ya no la necesita
    const siguiente = queue[0];
    const sigueEnPizarra = siguiente && (siguiente.board || siguiente.boardHold);
    if (pizarraActiva && !sigueEnPizarra) { ocultarPizarra().then(next); return; }
    next();
  }
}

function toggleLog(open) {
  const on = open ?? !elLog.classList.contains('on');
  elLog.classList.toggle('on', on);
  elLogBtn.setAttribute('aria-expanded', on);
  if (on) elLog.scrollTop = elLog.scrollHeight;   // lo último, primero a la vista
}

elPeek.addEventListener('click', () => { if (pizarraActiva) bajarMensaje(); });
elLogBtn.addEventListener('click', () => toggleLog());
elLog.addEventListener('click', (e) => {
  if (e.target.closest('.msg')) return;                    // deja seleccionar texto
  toggleLog(false);                                        // un clic fuera lo cierra
});

addEventListener('click', (e) => {
  if (e.target.closest('#avatars, #back, #log, #log-btn, .choice, #form, #peek-btn, #chapter')) return;
  if (elLog.classList.contains('on')) return;
  advance();
});
addEventListener('keydown', (e) => {
  if (e.code === 'Escape' && elLog.classList.contains('on')) { toggleLog(false); return; }
  if (e.target === elEntry || elLog.classList.contains('on')) return;
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); advance(); }
});

elForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const raw = elEntry.value.trim();
  const limpio = escapeText(raw);
  if (campoActivo) dicho[campoActivo] = limpio;
  // del primer campo sale además el nombre con el que le hablamos al docente
  if (campoActivo === 'presentacion') docente = nombreDe(raw) || docente;
  campoActivo = null;
  elEntry.value = '';
  elEntry.blur();
  flushPending();
  if (raw) addEntry('user', limpio);
  next();
});

/* «Soy Juanes», «me llamo Juanes», «mi nombre es Juanes» -> Juanes */
function nombreDe(raw) {
  const limpio = raw.replace(/^\s*(hola|buenas|buenos d[ií]as|buenas tardes)[\s,.!¡]*/i, '')
                    .replace(/^\s*(yo\s+)?(soy|me\s+llamo|mi\s+nombre\s+es|me\s+dicen)\s+/i, '');
  const first = limpio.split(/[\s,.;:]+/).filter(Boolean)[0];
  return first ? escapeText(first.charAt(0).toUpperCase() + first.slice(1)) : '';
}

function start() {
  queue = script.slice();
  next();
}

iniciarK7();
</script>
</body>
</html>
