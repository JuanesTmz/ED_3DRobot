<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K-7 &middot; C&oacute;mo empez&oacute; todo</title>
<style>
  :root{
    --navy:#1c2436;
    --navy-2:#27344a;
    --tag:#e8963c;
    --paper:#eef1f6;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    background:#0d1119;
    font-family:ui-rounded,"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;user-select:none;
  }

  #stage{
    position:fixed;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:clamp(4px,1vh,10px) clamp(4px,1vw,10px);
  }

  /* las proporciones de columnas/filas siguen el tamaño real de cada lámina
     -medido de antemano- para que "contain" casi no deje aire; el poco que
     quede se ve como el calle/gutter normal entre viñetas, no como hueco */
  #grid{
    width:100%;height:100%;
    display:grid;gap:2px;background:#000;
    grid-template-columns:1fr 1.18fr 1.06fr;
    grid-template-rows:1fr 0.9fr 0.81fr;
    grid-template-areas:
      "p1 p2 p3"
      "p4 p5 p6"
      "p7 p8 p9";
  }
  .cell{ position:relative; overflow:hidden; min-height:0; min-width:0; background:#0d1119 }
  .cell:nth-child(1){grid-area:p1}
  .cell:nth-child(2){grid-area:p2}
  .cell:nth-child(3){grid-area:p3}
  .cell:nth-child(4){grid-area:p4}
  .cell:nth-child(5){grid-area:p5}
  .cell:nth-child(6){grid-area:p6}
  .cell:nth-child(7){grid-area:p7}
  .cell:nth-child(8){grid-area:p8}
  .cell:nth-child(9){grid-area:p9}

  .cell .slot{
    position:absolute;inset:0;
    background:#161d2b;
    transition:opacity .3s ease;
  }
  /* la casilla que sigue en el orden respira un poco para invitar al clic */
  .cell.next .slot{
    background:#1c2436;
    box-shadow:inset 0 0 0 2px rgba(232,150,60,.55);
    animation:respirar 1.6s ease-in-out infinite;
  }
  @keyframes respirar{50%{background:#222c42}}

  .cell img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    opacity:0;transform:scale(.9);
    transition:opacity .4s ease, transform .5s cubic-bezier(.34,1.56,.64,1);
  }
  .cell.on img{opacity:1;transform:scale(1)}
  .cell.on .slot{opacity:0;pointer-events:none}

  #hint{
    position:fixed;left:50%;bottom:clamp(10px,3vh,26px);transform:translateX(-50%);
    color:rgba(255,255,255,.72);font-size:clamp(12px,1.6vw,15px);font-weight:600;
    letter-spacing:.02em;display:flex;align-items:center;gap:10px;
    text-shadow:0 2px 8px rgba(0,0,0,.4);
  }
  #hint .arrow{
    display:inline-block;width:0;height:0;
    border-left:7px solid transparent;border-right:7px solid transparent;
    border-top:9px solid var(--tag);animation:bob 1s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}

  #dots{
    position:fixed;left:50%;top:clamp(10px,3vh,22px);transform:translateX(-50%);
    display:flex;gap:6px;
  }
  #dots i{
    width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.22);
    transition:background .25s ease,transform .25s ease;
  }
  #dots i.on{background:var(--tag);transform:scale(1.2)}

  #app{position:fixed;inset:0;opacity:0;pointer-events:none;transition:opacity .5s ease}
  #app.out{opacity:1}

  /* ------------------------------------------------------------- celular */
  @media (max-width:700px){
    #grid{
      grid-template-columns:1fr 0.96fr;
      /* nunca "auto": la celda 9 no tiene alto propio -su imagen va en
         position:absolute- y una fila auto sobre eso colapsa a 0. Las
         proporciones, igual que en PC, siguen el tamaño real de cada lámina */
      grid-template-rows:1fr 0.98fr 0.82fr 0.87fr 1fr;
      grid-template-areas:
        "p1 p2"
        "p3 p4"
        "p5 p6"
        "p7 p8"
        "p9 p9";
    }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="dots"></div>
  <div id="grid">
    <div class="cell"><div class="slot"></div>
      <picture><source media="(max-width:700px)" srcset="comic-img/cel1.png"><img src="comic-img/pc1.png" alt=""></picture></div>
    <div class="cell"><div class="slot"></div>
      <picture><source media="(max-width:700px)" srcset="comic-img/cel2.png"><img src="comic-img/pc2.png" alt=""></picture></div>
    <div class="cell"><div class="slot"></div>
      <picture><source media="(max-width:700px)" srcset="comic-img/cel3.png"><img src="comic-img/pc3.png" alt=""></picture></div>
    <div class="cell"><div class="slot"></div>
      <picture><source media="(max-width:700px)" srcset="comic-img/cel4.png"><img src="comic-img/pc4.png" alt=""></picture></div>
    <div class="cell"><div class="slot"></div>
      <picture><source media="(max-width:700px)" srcset="comic-img/cel5.png"><img src="comic-img/pc5.png" alt=""></picture></div>
    <div class="cell"><div class="slot"></div>
      <picture><source media="(max-width:700px)" srcset="comic-img/cel6.png"><img src="comic-img/pc6.png" alt=""></picture></div>
    <div class="cell"><div class="slot"></div>
      <picture><source media="(max-width:700px)" srcset="comic-img/cel7.png"><img src="comic-img/pc7.png" alt=""></picture></div>
    <div class="cell"><div class="slot"></div>
      <picture><source media="(max-width:700px)" srcset="comic-img/cel8.png"><img src="comic-img/pc8.png" alt=""></picture></div>
    <div class="cell"><div class="slot"></div>
      <picture><source media="(max-width:700px)" srcset="comic-img/cel9.png"><img src="comic-img/pc9.png" alt=""></picture></div>
  </div>
</div>

<div id="hint"><span class="arrow"></span><span id="hint-txt">Clic para empezar</span></div>
<div id="app"></div>

<script>
const cells = Array.from(document.querySelectorAll('.cell'));
const dotsEl = document.getElementById('dots');
const hintTxt = document.getElementById('hint-txt');
const appOverlay = document.getElementById('app');
let revealed = 0;

for (let i = 0; i < cells.length; i++) {
  const d = document.createElement('i');
  dotsEl.appendChild(d);
}
const dots = Array.from(dotsEl.children);

function marcarSiguiente() {
  cells.forEach((c) => c.classList.remove('next'));
  if (revealed < cells.length) cells[revealed].classList.add('next');
}
marcarSiguiente();

function avanzar() {
  if (revealed < cells.length) {
    cells[revealed].classList.add('on');
    dots[revealed].classList.add('on');
    revealed++;
    marcarSiguiente();
    hintTxt.textContent = revealed < cells.length
      ? 'Clic para seguir'
      : 'Clic para empezar la expedición';
    return;
  }
  // ya se vieron las 9 viñetas: un clic mas y arranca la charla con K-7
  document.removeEventListener('click', avanzar);
  appOverlay.classList.add('out');
  setTimeout(() => { location.href = 'charla.html'; }, 480);
}

document.addEventListener('click', avanzar);
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowRight') {
    e.preventDefault();
    avanzar();
  }
});
</script>
</body>
</html>
