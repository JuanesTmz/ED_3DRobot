<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ED 3D Robot</title>
<style>
  :root{
    --magenta:#e7448c; --lime:#96c42e; --yellow:#f6bf1c;
    --teal:#5a98bd;    --navy:#27344a;  --paper:#eef1f6;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(120% 100% at 50% 0%,#fdfdff 0%,var(--paper) 55%,#dfe5ee 100%);
    color:var(--navy);overflow:hidden;
  }
  #app{position:fixed;inset:0}
  canvas{display:block}

  header{
    position:fixed;top:0;left:0;right:0;padding:22px 26px;
    display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
    pointer-events:none;z-index:5;
  }
  h1{
    margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em;
  }
  h1 span{color:var(--magenta)}
  .sub{font-size:13px;opacity:.55}
  #link-charla{
    pointer-events:auto;color:var(--magenta);opacity:.9;
    text-decoration:none;font-weight:600;
  }
  #link-charla:hover{text-decoration:underline}

  #panel{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    display:flex;gap:8px;padding:7px;border-radius:999px;z-index:5;
    background:rgba(255,255,255,.72);backdrop-filter:blur(10px);
    border:1px solid rgba(39,52,74,.10);
    box-shadow:0 6px 22px rgba(39,52,74,.13);
  }
  button{
    font:inherit;font-size:13px;font-weight:600;color:var(--navy);
    padding:8px 16px;border:0;border-radius:999px;background:transparent;
    cursor:pointer;transition:background .15s,color .15s;
  }
  button:hover{background:rgba(39,52,74,.07)}
  button[aria-pressed="true"]{background:var(--magenta);color:#fff}

  #models{
    position:fixed;top:18px;right:26px;
    display:flex;gap:6px;padding:6px;border-radius:999px;z-index:6;
    background:rgba(255,255,255,.72);backdrop-filter:blur(10px);
    border:1px solid rgba(39,52,74,.10);
    box-shadow:0 6px 22px rgba(39,52,74,.13);
  }
  #models button{padding:7px 14px;font-size:12px}
  #models button[aria-pressed="true"]{background:var(--teal)}

  #palettes{
    position:fixed;top:64px;right:26px;
    display:flex;gap:6px;padding:6px;border-radius:999px;z-index:6;
    background:rgba(255,255,255,.72);backdrop-filter:blur(10px);
    border:1px solid rgba(39,52,74,.10);
    box-shadow:0 6px 22px rgba(39,52,74,.13);
  }
  #palettes button{
    display:flex;align-items:center;gap:7px;padding:7px 13px;font-size:12px;
  }
  #palettes button[aria-pressed="true"]{background:var(--navy)}
  /* muestrario: los mismos colores que lleva el modelo */
  .sw{display:flex;gap:2px}
  .sw i{width:7px;height:14px;border-radius:2px;background:var(--c)}

  #hint{
    position:fixed;right:26px;bottom:32px;font-size:12px;opacity:.42;z-index:5;
  }
  #loader{
    position:fixed;inset:0;display:grid;place-content:center;gap:14px;
    justify-items:center;z-index:10;background:var(--paper);
    transition:opacity .5s;font-size:13px;
  }
  #loader.done{opacity:0;pointer-events:none}
  .bar{width:160px;height:4px;border-radius:2px;background:rgba(39,52,74,.12);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--magenta);transition:width .2s}
  #err{
    position:fixed;inset:auto 20px 20px 20px;padding:14px 16px;border-radius:10px;
    background:#3b1220;color:#ffd9e4;font:12px/1.5 ui-monospace,monospace;
    white-space:pre-wrap;display:none;z-index:20;
  }

  @media (max-width:560px){
    #hint{display:none}
    header{padding:16px 18px}
    /* left+translateX(-50%) para centrar. width:max-content porque, fijo con
       left+bottom+transform a la vez, Chrome encoge el shrink-to-fit por
       debajo del ancho real y parte el texto de los botones en dos lineas */
    #models{top:auto;bottom:126px;left:50%;right:auto;transform:translateX(-50%);width:max-content}
    #palettes{top:auto;bottom:82px;left:50%;right:auto;transform:translateX(-50%);width:max-content}
  }
</style>
</head>
<body>

<div id="app"></div>

<header>
  <h1>ED <span>3D Robot</span></h1>
  <div class="sub">low-poly &middot; three.js</div>
  <a class="sub" id="link-charla" href="./charla.html">hablar con K-7 →</a>
</header>

<div id="models">
  <button data-mesh="Modelo1" aria-pressed="true">Modelo 1</button>
  <button data-mesh="Modelo2" aria-pressed="false">Modelo 2</button>
  <button data-mesh="Modelo3" aria-pressed="false">Modelo 3</button>
</div>

<div id="palettes">
  <button data-pal="uno" aria-pressed="true">
    <span class="sw"><i style="--c:#f48dbd"></i><i style="--c:#cae376"></i><i style="--c:#a0cbdf"></i><i style="--c:#fbe05d"></i></span>
    Paleta 1
  </button>
  <button data-pal="dos" aria-pressed="false">
    <span class="sw"><i style="--c:#ff5bff"></i><i style="--c:#4ef707"></i><i style="--c:#35bfff"></i><i style="--c:#fce907"></i></span>
    Paleta 2
  </button>
</div>

<div id="panel">
  <button id="btn-play"  aria-pressed="true">Pausa</button>
  <button id="btn-spin"  aria-pressed="true">Giro</button>
  <button id="btn-bones" aria-pressed="false">Huesos</button>
  <button id="btn-reset" aria-pressed="false">Reencuadrar</button>
</div>

<div id="hint">arrastra para orbitar &middot; rueda para zoom</div>

<div id="loader"><div class="bar"><i></i></div><div id="loader-txt">cargando modelo…</div></div>
<pre id="err"></pre>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { aplicarPaleta, conectarBotones } from './paleta.js';

const errBox = document.getElementById('err');
const fail = (m) => { errBox.style.display = 'block'; errBox.textContent += m + '\n'; };
window.addEventListener('error', e => fail(e.message));

const app = document.getElementById('app');
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
// se recalculan al cargar cada modelo, a partir de su bounding box
const HOME = new THREE.Vector3(2.4, 1.9, 3.6);
const TARGET = new THREE.Vector3(0, 0.95, 0);
const VIEW_DIR = new THREE.Vector3(2.4, 0.95, 3.6).normalize();
camera.position.copy(HOME);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(TARGET);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 1.6;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.52;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;

scene.add(new THREE.HemisphereLight(0xd8e4f5, 0x9aa6b8, 1.35));

const key = new THREE.DirectionalLight(0xffffff, 2.1);
key.position.set(1.8, 6.2, 2.2);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.radius = 3;
key.shadow.bias = -0.0012;
const s = key.shadow.camera;
s.left = -1.8; s.right = 1.8; s.top = 2.6; s.bottom = -1.8; s.near = 0.5; s.far = 14;
scene.add(key);

const fill = new THREE.DirectionalLight(0xcfe0ff, 0.55);
fill.position.set(-3.5, 1.6, 2.2);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 0.45);
rim.position.set(0, 2.4, -4.0);
scene.add(rim);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(3.4, 64).rotateX(-Math.PI / 2),
  new THREE.ShadowMaterial({ opacity: 0.20 })
);
ground.receiveShadow = true;
scene.add(ground);

// robot.glb trae las tres mallas skinneadas al MISMO armature y una sola
// accion Idle: cambiar de modelo es solo alternar visibilidad, el rig y la
// animacion son compartidos y no se reinician.
const MESHES = ['Modelo1', 'Modelo2', 'Modelo3'];

let model = null, mixer = null, action = null, skeletonHelper = null;
const parts = {};
const clock = new THREE.Clock();

// La boca ya no va en la malla: build_bocas.py le quito a los modelos la
// sonrisa que traian soldada al hueso 'head', con su cascara de contorno, y
// dejo las cuatro bocas sueltas en bocas.glb. Aqui no habla nadie, asi que
// basta con la de reposo colgada del mismo hueso: sigue a la cabeza sin
// formar parte del skin.
// Sitio y tamano los pone cada modelo, que tienen la cara a distinta altura y
// anchura; son las medidas de la sonrisa que se les quito.
const BOCA_DE_MODELO = {
  Modelo1: { pos: [0, 0.1883, 0.298], escala: 0.3172 },
  Modelo2: { pos: [0, 0.2338, 0.400], escala: 0.2474 },
  // Modelo3 lleva el cubo volteado y la carita bajada, porque la esquina
  // del cubo le caia encima. La z ya no es la del plano de la cara: el
  // cubo girado no ofrece un plano de frente sino una arista, asi que la
  // boca se adelanta hasta librarla. Lo mide build_modelo3.py y lo
  // imprime al acabar.
  Modelo3: { pos: [0.0, 0.1389, 0.4352], escala: 0.2474 },
};
// la sonrisa esta dibujada del ancho de la vieja y se leia demasiado abierta
const ANCHO = 0.85;

let boca = null, hCabeza = null;

const loaderEl = document.getElementById('loader');
const loaderTxt = document.getElementById('loader-txt');
const barEl = document.querySelector('.bar i');
const btnPlay  = document.getElementById('btn-play');
const btnBones = document.getElementById('btn-bones');
const modelBtns = [...document.querySelectorAll('#models button')];

// Las dos paletas valen para los dos modelos: cada material tiene un rol y
// cada paleta da un color por rol (ver paleta.js).
let paleta = conectarBotones('#palettes button', (id) => {
  paleta = id;
  if (model) aplicarPaleta(model, id);
});

// deja la camara a una distancia proporcional al tamano del modelo
function frame(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  box.getCenter(TARGET);
  const size = box.getSize(new THREE.Vector3());
  const radius = Math.max(size.x, size.y, size.z) * 0.5;
  const dist = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov * 0.5)) * 1.7;

  HOME.copy(VIEW_DIR).multiplyScalar(dist).add(TARGET);
  controls.minDistance = dist * 0.35;
  controls.maxDistance = dist * 3;
  resetView();
}

function resetView() {
  camera.position.copy(HOME);
  controls.target.copy(TARGET);
  controls.update();
}

function showMesh(name) {
  for (const n of MESHES) if (parts[n]) parts[n].visible = (n === name);
  colocarBoca(name);
  for (const b of modelBtns) b.setAttribute('aria-pressed', b.dataset.mesh === name);
}

function colocarBoca(nombreMalla) {
  const m = BOCA_DE_MODELO[nombreMalla];
  if (!boca || !m) return;
  boca.position.set(...m.pos);
  boca.scale.set(m.escala * ANCHO, m.escala, m.escala);
}

// la boca y el robot llegan por su cuenta y sin orden garantizado, asi que
// esto se llama desde los dos sitios y solo actua cuando ya estan los dos
function montarBoca() {
  if (!boca || !hCabeza || boca.parent === hCabeza) return;
  hCabeza.add(boca);
  colocarBoca(MESHES.find((n) => parts[n] && parts[n].visible) || MESHES[0]);
  aplicarPaleta(model, paleta);   // ya cuelga del modelo: hay que pintarla
}

new GLTFLoader().load('bocas.glb', (gltf) => {
  boca = gltf.scene.getObjectByName('feliz');
  if (!boca) { fail('falta la boca feliz en bocas.glb'); return; }
  boca.castShadow = false;      // es plana y va pegada a la cara
  boca.receiveShadow = false;
  boca.frustumCulled = false;   // cuelga de un hueso: su caja no se recalcula
  montarBoca();
}, undefined, (e) => fail('bocas.glb: ' + e.message));

new GLTFLoader().load(
  'robot.glb',
  (gltf) => {
    model = gltf.scene;

    model.traverse((o) => {
      if (!o.isMesh) return;
      o.castShadow = true;
      o.receiveShadow = true;
      // la malla skinned se sale de su bounding box al animarse
      o.frustumCulled = false;

      const mats = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of mats) {
        // contorno por casco invertido: normales ya volteadas al exportar
        if (/outline/i.test(m.name)) {
          m.side = THREE.FrontSide;
          m.polygonOffset = true;
          m.polygonOffsetFactor = 1;
        }
        if (m.name === 'M_lens') { m.transparent = true; m.opacity = 0.22; }
      }
    });

    scene.add(model);

    for (const n of MESHES) parts[n] = model.getObjectByName(n);
    const missing = MESHES.filter((n) => !parts[n]);
    if (missing.length) fail('faltan mallas en robot.glb: ' + missing.join(', '));

    hCabeza = model.getObjectByName('head');
    if (!hCabeza) fail('falta el hueso head en robot.glb: K-7 se queda sin boca');
    montarBoca();

    if (gltf.animations.length) {
      mixer = new THREE.AnimationMixer(model);
      action = mixer.clipAction(gltf.animations[0]);
      action.play();
    }

    skeletonHelper = new THREE.SkeletonHelper(model);
    skeletonHelper.visible = false;
    skeletonHelper.material.linewidth = 2;
    scene.add(skeletonHelper);

    // encuadra con las tres mallas visibles: comparten proporciones, asi que
    // el encuadre vale para todas y no hay que recolocar la camara al
    // cambiar de modelo
    aplicarPaleta(model, paleta);

    frame(model);
    showMesh(MESHES[0]);

    loaderEl.classList.add('done');
  },
  (e) => {
    if (e.lengthComputable) barEl.style.width = (e.loaded / e.total * 100) + '%';
  },
  (e) => {
    loaderTxt.textContent =
      'no se pudo cargar el modelo — ¿estás sirviendo la carpeta por HTTP?';
    fail('GLTFLoader: ' + e.message);
  }
);

for (const b of modelBtns) b.addEventListener('click', () => showMesh(b.dataset.mesh));

const toggle = (btn, fn) => btn.addEventListener('click', () => {
  const on = btn.getAttribute('aria-pressed') !== 'true';
  btn.setAttribute('aria-pressed', on);
  fn(on, btn);
});

toggle(btnPlay, (on, b) => {
  b.textContent = on ? 'Pausa' : 'Reanudar';
  if (action) action.paused = !on;
});
toggle(document.getElementById('btn-spin'), (on) => { controls.autoRotate = on; });
toggle(btnBones, (on) => {
  if (skeletonHelper) skeletonHelper.visible = on;
});
document.getElementById('btn-reset').addEventListener('click', resetView);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  if (mixer) mixer.update(clock.getDelta());
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
