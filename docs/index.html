<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ED 3D Robot</title>
<style>
  :root{
    --magenta:#e7448c; --lime:#96c42e; --yellow:#f6bf1c;
    --teal:#5a98bd;    --navy:#27344a;  --paper:#eef1f6;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(120% 100% at 50% 0%,#fdfdff 0%,var(--paper) 55%,#dfe5ee 100%);
    color:var(--navy);overflow:hidden;
  }
  #app{position:fixed;inset:0}
  canvas{display:block}

  header{
    position:fixed;top:0;left:0;right:0;padding:22px 26px;
    display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
    pointer-events:none;z-index:5;
  }
  h1{
    margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em;
  }
  h1 span{color:var(--magenta)}
  .sub{font-size:13px;opacity:.55}
  #link-charla{
    pointer-events:auto;color:var(--magenta);opacity:.9;
    text-decoration:none;font-weight:600;
  }
  #link-charla:hover{text-decoration:underline}

  #panel{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    display:flex;gap:8px;padding:7px;border-radius:999px;z-index:5;
    background:rgba(255,255,255,.72);backdrop-filter:blur(10px);
    border:1px solid rgba(39,52,74,.10);
    box-shadow:0 6px 22px rgba(39,52,74,.13);
  }
  button{
    font:inherit;font-size:13px;font-weight:600;color:var(--navy);
    padding:8px 16px;border:0;border-radius:999px;background:transparent;
    cursor:pointer;transition:background .15s,color .15s;
  }
  button:hover{background:rgba(39,52,74,.07)}
  button[aria-pressed="true"]{background:var(--magenta);color:#fff}

  #models{
    position:fixed;top:18px;right:26px;
    display:flex;gap:6px;padding:6px;border-radius:999px;z-index:6;
    background:rgba(255,255,255,.72);backdrop-filter:blur(10px);
    border:1px solid rgba(39,52,74,.10);
    box-shadow:0 6px 22px rgba(39,52,74,.13);
  }
  #models button{padding:7px 14px;font-size:12px}
  #models button[aria-pressed="true"]{background:var(--teal)}

  #palettes{
    position:fixed;top:64px;right:26px;
    display:flex;gap:6px;padding:6px;border-radius:999px;z-index:6;
    background:rgba(255,255,255,.72);backdrop-filter:blur(10px);
    border:1px solid rgba(39,52,74,.10);
    box-shadow:0 6px 22px rgba(39,52,74,.13);
  }
  #palettes button{
    display:flex;align-items:center;gap:7px;padding:7px 13px;font-size:12px;
  }
  #palettes button[aria-pressed="true"]{background:var(--navy)}
  /* muestrario: los mismos colores que lleva el modelo */
  .sw{display:flex;gap:2px}
  .sw i{width:7px;height:14px;border-radius:2px;background:var(--c)}

  #anims{
    position:fixed;left:50%;bottom:78px;transform:translateX(-50%);
    display:flex;gap:8px;padding:7px;border-radius:999px;z-index:5;
    flex-wrap:wrap;justify-content:center;max-width:min(92vw,560px);
    background:rgba(255,255,255,.72);backdrop-filter:blur(10px);
    border:1px solid rgba(39,52,74,.10);
    box-shadow:0 6px 22px rgba(39,52,74,.13);
  }
  #anims button[aria-pressed="true"]{background:var(--lime);color:#1c2436}

  #anims-burger{display:none}
  #anims-menu{
    display:flex;flex-direction:column;gap:6px;
    position:fixed;left:50%;bottom:128px;transform:translateX(-50%);
    padding:8px;border-radius:16px;z-index:5;min-width:160px;
    background:rgba(255,255,255,.9);backdrop-filter:blur(10px);
    border:1px solid rgba(39,52,74,.10);
    box-shadow:0 6px 22px rgba(39,52,74,.13);
  }
  #anims-menu button{text-align:left;border-radius:10px}
  #anims-menu[hidden]{display:none}
  #anims-menu button[aria-pressed="true"]{background:var(--lime);color:#1c2436}

  #dev{
    position:fixed;top:18px;left:26px;z-index:7;width:230px;
    padding:12px;border-radius:14px;font-size:12px;
    background:rgba(255,255,255,.88);backdrop-filter:blur(10px);
    border:1px solid rgba(39,52,74,.10);
    box-shadow:0 6px 22px rgba(39,52,74,.13);
  }
  #dev[hidden]{display:none}
  #dev h2{margin:0 0 8px;font-size:13px}
  #dev .dev-row{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  #dev select{font:inherit;padding:4px 6px;border-radius:8px;border:1px solid rgba(39,52,74,.2);flex:1}
  #dev button{padding:6px 10px;font-size:12px;background:rgba(39,52,74,.07)}
  #dev button[aria-pressed="true"]{background:var(--magenta);color:#fff}
  #dev pre{
    background:rgba(39,52,74,.06);padding:8px;border-radius:8px;
    white-space:pre-wrap;word-break:break-all;margin:0 0 8px;
    font:11px/1.4 ui-monospace,monospace;max-height:160px;overflow:auto;
  }

  #hint{
    position:fixed;right:26px;bottom:32px;font-size:12px;opacity:.42;z-index:5;
  }
  #loader{
    position:fixed;inset:0;display:grid;place-content:center;gap:14px;
    justify-items:center;z-index:10;background:var(--paper);
    transition:opacity .5s;font-size:13px;
  }
  #loader.done{opacity:0;pointer-events:none}
  .bar{width:160px;height:4px;border-radius:2px;background:rgba(39,52,74,.12);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--magenta);transition:width .2s}
  #err{
    position:fixed;inset:auto 20px 20px 20px;padding:14px 16px;border-radius:10px;
    background:#3b1220;color:#ffd9e4;font:12px/1.5 ui-monospace,monospace;
    white-space:pre-wrap;display:none;z-index:20;
  }

  @media (max-width:560px){
    #hint{display:none}
    header{padding:16px 18px}
    /* left+translateX(-50%) para centrar. width:max-content porque, fijo con
       left+bottom+transform a la vez, Chrome encoge el shrink-to-fit por
       debajo del ancho real y parte el texto de los botones en dos lineas */
    #models{top:auto;bottom:174px;left:50%;right:auto;transform:translateX(-50%);width:max-content}
    #palettes{top:auto;bottom:130px;left:50%;right:auto;transform:translateX(-50%);width:max-content}
    /* en movil los 6 botones de #anims no caben en una fila y quedan
       ilegibles/imposibles de tocar: se reemplazan por una hamburguesa */
    #anims{display:none}
    #anims-burger{
      display:flex;align-items:center;gap:6px;
      position:fixed;left:50%;bottom:78px;transform:translateX(-50%);
      padding:9px 18px;border-radius:999px;z-index:5;
      background:rgba(255,255,255,.72);backdrop-filter:blur(10px);
      border:1px solid rgba(39,52,74,.10);
      box-shadow:0 6px 22px rgba(39,52,74,.13);
    }
  }
</style>
</head>
<body>

<div id="app"></div>

<header>
  <h1>ED <span>3D Robot</span></h1>
  <div class="sub">low-poly &middot; three.js</div>
  <a class="sub" id="link-charla" href="./charla.html">hablar con K-7 →</a>
</header>

<div id="models">
  <button data-mesh="Modelo1" aria-pressed="true">Modelo 1</button>
  <button data-mesh="Modelo2" aria-pressed="false">Modelo 2</button>
  <button data-mesh="Modelo3" aria-pressed="false">Modelo 3</button>
</div>

<div id="palettes">
  <button data-pal="uno" aria-pressed="true">
    <span class="sw"><i style="--c:#f48dbd"></i><i style="--c:#cae376"></i><i style="--c:#a0cbdf"></i><i style="--c:#fbe05d"></i></span>
    Paleta 1
  </button>
  <button data-pal="dos" aria-pressed="false">
    <span class="sw"><i style="--c:#ff5bff"></i><i style="--c:#4ef707"></i><i style="--c:#35bfff"></i><i style="--c:#fce907"></i></span>
    Paleta 2
  </button>
  <button data-pal="tres" aria-pressed="false">
    <span class="sw"><i style="--c:#d852db"></i><i style="--c:#4fc180"></i><i style="--c:#50aed8"></i><i style="--c:#ead34e"></i></span>
    Paleta 3
  </button>
</div>

<div id="anims">
  <button data-anim="Idle"        aria-pressed="true">Reposo</button>
  <button data-anim="K7_Pensando" aria-pressed="false">Pensando</button>
  <button data-anim="K7_Saltito"  aria-pressed="false">Saltito</button>
  <button data-anim="K7_Triste"   aria-pressed="false">Triste</button>
  <button data-anim="K7_HighFive" aria-pressed="false">HighFive</button>
  <button data-anim="K7_Caminando" aria-pressed="false">Caminando</button>
</div>

<!-- version movil de #anims: los mismos botones, en menu desplegable -->
<button id="anims-burger" aria-expanded="false" aria-controls="anims-menu">☰ Pose</button>
<div id="anims-menu" hidden>
  <button data-anim="Idle"        aria-pressed="true">Reposo</button>
  <button data-anim="K7_Pensando" aria-pressed="false">Pensando</button>
  <button data-anim="K7_Saltito"  aria-pressed="false">Saltito</button>
  <button data-anim="K7_Triste"   aria-pressed="false">Triste</button>
  <button data-anim="K7_HighFive" aria-pressed="false">HighFive</button>
  <button data-anim="K7_Caminando" aria-pressed="false">Caminando</button>
</div>

<!-- panel de ajuste manual: solo con ?dev=1 en la URL -->
<div id="dev" hidden>
  <h2>Ajuste de hueso</h2>
  <div class="dev-row">
    <select id="dev-bone"></select>
  </div>
  <div class="dev-row">
    <button id="dev-mode-rotate" aria-pressed="true">Rotar</button>
    <button id="dev-mode-translate" aria-pressed="false">Mover</button>
    <button id="dev-reset">Reiniciar</button>
  </div>
  <pre id="dev-readout"></pre>
  <div class="dev-row">
    <button id="dev-copy">Copiar valores</button>
  </div>
</div>

<div id="panel">
  <button id="btn-play"  aria-pressed="true">Pausa</button>
  <button id="btn-spin"  aria-pressed="true">Giro</button>
  <button id="btn-bones" aria-pressed="false">Huesos</button>
  <button id="btn-reset" aria-pressed="false">Reencuadrar</button>
</div>

<div id="hint">arrastra para orbitar &middot; rueda para zoom</div>

<div id="loader"><div class="bar"><i></i></div><div id="loader-txt">cargando modelo…</div></div>
<pre id="err"></pre>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader }        from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls }     from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { aplicarPaleta, conectarBotones } from './paleta.js';

// ?dev=1 activa el panel de ajuste manual de huesos (mover/rotar con gizmo)
const DEV = new URLSearchParams(location.search).get('dev') === '1';

const errBox = document.getElementById('err');
const fail = (m) => { errBox.style.display = 'block'; errBox.textContent += m + '\n'; };
window.addEventListener('error', e => fail(e.message));

const app = document.getElementById('app');
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
// se recalculan al cargar cada modelo, a partir de su bounding box
const HOME = new THREE.Vector3(2.4, 1.9, 3.6);
const TARGET = new THREE.Vector3(0, 0.95, 0);
const VIEW_DIR = new THREE.Vector3(2.4, 0.95, 3.6).normalize();
camera.position.copy(HOME);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(TARGET);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 1.6;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.52;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;

scene.add(new THREE.HemisphereLight(0xd8e4f5, 0x9aa6b8, 1.35));

const key = new THREE.DirectionalLight(0xffffff, 2.1);
key.position.set(1.8, 6.2, 2.2);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.radius = 3;
key.shadow.bias = -0.0012;
const s = key.shadow.camera;
s.left = -1.8; s.right = 1.8; s.top = 2.6; s.bottom = -1.8; s.near = 0.5; s.far = 14;
scene.add(key);

const fill = new THREE.DirectionalLight(0xcfe0ff, 0.55);
fill.position.set(-3.5, 1.6, 2.2);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 0.45);
rim.position.set(0, 2.4, -4.0);
scene.add(rim);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(3.4, 64).rotateX(-Math.PI / 2),
  new THREE.ShadowMaterial({ opacity: 0.20 })
);
ground.receiveShadow = true;
scene.add(ground);

// robot.glb trae las tres mallas skinneadas al MISMO armature y una sola
// accion Idle: cambiar de modelo es solo alternar visibilidad, el rig y la
// animacion son compartidos y no se reinician.
const MESHES = ['Modelo1', 'Modelo2', 'Modelo3'];

let model = null, mixer = null, skeletonHelper = null;
const parts = {};
const clock = new THREE.Clock();
let paused = false;

// Animaciones: todas las acciones se reproducen a la vez y se mezclan por
// peso (el patron estandar de three.js para blending), asi que cambiar de
// animacion es solo una rampa de pesos -fadeOut/fadeIn- y nunca un salto.
const actions = {};
let activeAction = null;
const UNA_VEZ = new Set(['K7_Saltito', 'K7_HighFive']);   // gestos: se tocan una vez y vuelven a Reposo
const animBtns = [];

function fadeToAction(name, duration = 0.5) {
  const next = actions[name];
  if (!next || next === activeAction) return;
  const prev = activeAction;
  activeAction = next;

  next.reset();
  next.setEffectiveTimeScale(1);
  next.setEffectiveWeight(1);
  next.fadeIn(duration);
  next.play();
  if (prev) prev.fadeOut(duration);

  aplicarGesto(name);
  for (const b of animBtns) b.setAttribute('aria-pressed', b.dataset.anim === name);
}

// ---------------------------------------------------------- modo ?dev=1 ----
// Gizmo para mover/rotar un hueso a mano y leer los numeros resultantes -el
// mismo tipo de panel que ya se uso antes para calibrar la boca a ojo-, esta
// vez para retocar poses del rig sin pasar por Blender.
let transformControls = null;
let devBone = null;
let devBaseline = null;

function setupDevMode() {
  if (!DEV || !model || !skeletonHelper) return;
  document.getElementById('dev').hidden = false;

  // congela en la pose que se va a retocar, en su instante base (frame 0,
  // sin la respiracion del idle superpuesta)
  const target = actions['K7_Pensando'] ? 'K7_Pensando' : 'Idle';
  for (const name in actions) actions[name].setEffectiveWeight(name === target ? 1 : 0);
  activeAction = actions[target];
  if (activeAction) { activeAction.time = 0; mixer.update(0); }
  paused = true;
  aplicarGesto(target);
  for (const b of animBtns) b.setAttribute('aria-pressed', b.dataset.anim === target);
  controls.autoRotate = false;
  if (skeletonHelper) skeletonHelper.visible = true;
  btnBones?.setAttribute('aria-pressed', 'true');

  transformControls = new TransformControls(camera, renderer.domElement);
  transformControls.setSpace('local');
  transformControls.addEventListener('dragging-changed', (e) => { controls.enabled = !e.value; });
  transformControls.addEventListener('objectChange', updateDevReadout);
  scene.add(transformControls.getHelper());

  const boneSelect = document.getElementById('dev-bone');
  const bones = skeletonHelper.bones.slice().sort((a, b) => a.name.localeCompare(b.name));
  for (const b of bones) {
    const opt = document.createElement('option');
    opt.value = b.name;
    opt.textContent = b.name;
    boneSelect.appendChild(opt);
  }
  const startBone = bones.find((b) => b.name === 'upperarm_R') ? 'upperarm_R' : bones[0]?.name;
  boneSelect.value = startBone;
  selectDevBone(startBone);
  boneSelect.addEventListener('change', () => selectDevBone(boneSelect.value));

  document.getElementById('dev-mode-rotate').addEventListener('click', () => setDevGizmoMode('rotate'));
  document.getElementById('dev-mode-translate').addEventListener('click', () => setDevGizmoMode('translate'));
  document.getElementById('dev-copy').addEventListener('click', copyDevValues);
  document.getElementById('dev-reset').addEventListener('click', () => {
    if (!devBone || !devBaseline) return;
    devBone.quaternion.copy(devBaseline.quaternion);
    devBone.position.copy(devBaseline.position);
    updateDevReadout();
  });
}

function selectDevBone(name) {
  devBone = skeletonHelper.bones.find((b) => b.name === name);
  if (!devBone) return;
  devBaseline = { quaternion: devBone.quaternion.clone(), position: devBone.position.clone() };
  transformControls.attach(devBone);
  updateDevReadout();
}

function setDevGizmoMode(mode) {
  transformControls.setMode(mode);
  document.getElementById('dev-mode-rotate').setAttribute('aria-pressed', String(mode === 'rotate'));
  document.getElementById('dev-mode-translate').setAttribute('aria-pressed', String(mode === 'translate'));
}

function updateDevReadout() {
  if (!devBone) return;
  const q = devBone.quaternion;
  const e = new THREE.Euler().setFromQuaternion(q, 'XYZ');
  const toDeg = (r) => (r * 180 / Math.PI).toFixed(1);
  document.getElementById('dev-readout').textContent =
    `hueso: ${devBone.name}\n` +
    `quat (w,x,y,z):\n  ${q.w.toFixed(4)}, ${q.x.toFixed(4)}, ${q.y.toFixed(4)}, ${q.z.toFixed(4)}\n` +
    `euler XYZ (grados):\n  ${toDeg(e.x)}, ${toDeg(e.y)}, ${toDeg(e.z)}\n` +
    `posicion local:\n  ${devBone.position.x.toFixed(4)}, ${devBone.position.y.toFixed(4)}, ${devBone.position.z.toFixed(4)}`;
}

function copyDevValues() {
  if (!devBone) return;
  const q = devBone.quaternion;
  const p = devBone.position;
  const text = JSON.stringify({
    bone: devBone.name,
    quaternion_wxyz: [q.w, q.x, q.y, q.z],
    position: [p.x, p.y, p.z],
  }, null, 2);
  const btn = document.getElementById('dev-copy');
  const old = btn.textContent;
  navigator.clipboard?.writeText(text)
    .then(() => { btn.textContent = 'Copiado!'; setTimeout(() => { btn.textContent = old; }, 1200); })
    .catch(() => { btn.textContent = 'No se pudo copiar'; setTimeout(() => { btn.textContent = old; }, 1200); });
}

// La boca y los ojos ya no van en la malla: build_bocas.py y build_ojos.py le
// quitaron a los modelos la sonrisa y los ojos que traian soldados al hueso
// 'head' (con su cascara de contorno) y dejaron las mallas sueltas en
// bocas.glb y ojos.glb. Cuelgan del mismo hueso y solo una de cada juego esta
// visible a la vez: cambiar de gesto es solo alternar visibilidad.
// Sitio y tamano los pone cada modelo, que tienen la cara a distinta altura y
// anchura; son las medidas de la sonrisa/ojos que se les quito.
const BOCA_DE_MODELO = {
  Modelo1: { pos: [0, 0.1883, 0.298], escala: 0.3172 },
  Modelo2: { pos: [0, 0.2338, 0.400], escala: 0.2474 },
  // Modelo3 lleva el cubo volteado y la carita bajada, porque la esquina
  // del cubo le caia encima. La z ya no es la del plano de la cara: el
  // cubo girado no ofrece un plano de frente sino una arista, asi que la
  // boca se adelanta hasta librarla. Lo mide build_modelo3.py y lo
  // imprime al acabar.
  Modelo3: { pos: [0.0, 0.1389, 0.4352], escala: 0.2474 },
};
// la sonrisa esta dibujada del ancho de la vieja y se leia demasiado abierta
const ANCHO = 0.85;

const OJOS_DE_MODELO = {
  Modelo1: { pos: [0, 0.4670, 0.3100], escala: 0.5294 },
  Modelo2: { pos: [0, 0.5218, 0.4202], escala: 0.4129 },
  Modelo3: { pos: [0, 0.3858, 0.4722], escala: 0.4129 },
};

// gesto de cada animacion: que boca y que ojos le corresponden. Las que no
// tienen una emocion propia se quedan con la cara de reposo.
const GESTO_DE_ANIM = {
  Idle:         { boca: 'feliz', ojos: 'normal' },
  K7_Caminando: { boca: 'feliz', ojos: 'normal' },
  K7_HighFive:  { boca: 'feliz', ojos: 'guino' },
  K7_Saltito:   { boca: 'feliz', ojos: 'doble_guino' },
  K7_Triste:    { boca: 'triste', ojos: 'triste' },
  K7_Pensando:  { boca: 'pensando', ojos: 'pensando' },
};

const bocas = {}, ojos = {};
let hCabeza = null;
let bocaPuesta = null, ojosPuestos = null;

function ponerBoca(nombre) {
  if (bocaPuesta === nombre || !bocas[nombre]) return;
  bocaPuesta = nombre;
  for (const n in bocas) bocas[n].visible = (n === nombre);
}

function ponerOjos(nombre) {
  if (ojosPuestos === nombre || !ojos[nombre]) return;
  ojosPuestos = nombre;
  for (const n in ojos) ojos[n].visible = (n === nombre);
}

function aplicarGesto(nombreAnim) {
  const g = GESTO_DE_ANIM[nombreAnim];
  if (!g) return;
  ponerBoca(g.boca);
  ponerOjos(g.ojos);
}

const loaderEl = document.getElementById('loader');
const loaderTxt = document.getElementById('loader-txt');
const barEl = document.querySelector('.bar i');
const btnPlay  = document.getElementById('btn-play');
const btnBones = document.getElementById('btn-bones');
const modelBtns = [...document.querySelectorAll('#models button')];

// Las dos paletas valen para los dos modelos: cada material tiene un rol y
// cada paleta da un color por rol (ver paleta.js).
let paleta = conectarBotones('#palettes button', (id) => {
  paleta = id;
  if (model) aplicarPaleta(model, id);
});

// deja la camara a una distancia proporcional al tamano del modelo
function frame(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  box.getCenter(TARGET);
  const size = box.getSize(new THREE.Vector3());
  const radius = Math.max(size.x, size.y, size.z) * 0.5;
  const dist = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov * 0.5)) * 1.7;

  HOME.copy(VIEW_DIR).multiplyScalar(dist).add(TARGET);
  controls.minDistance = dist * 0.35;
  controls.maxDistance = dist * 3;
  resetView();
}

function resetView() {
  camera.position.copy(HOME);
  controls.target.copy(TARGET);
  controls.update();
}

function showMesh(name) {
  for (const n of MESHES) if (parts[n]) parts[n].visible = (n === name);
  colocarBoca(name);
  colocarOjos(name);
  for (const b of modelBtns) b.setAttribute('aria-pressed', b.dataset.mesh === name);
}

function colocarBoca(nombreMalla) {
  const m = BOCA_DE_MODELO[nombreMalla];
  if (!m) return;
  for (const n in bocas) {
    bocas[n].position.set(...m.pos);
    bocas[n].scale.set(m.escala * ANCHO, m.escala, m.escala);
  }
}

function colocarOjos(nombreMalla) {
  const m = OJOS_DE_MODELO[nombreMalla];
  if (!m) return;
  for (const n in ojos) {
    ojos[n].position.set(...m.pos);
    ojos[n].scale.setScalar(m.escala);
  }
}

// la boca/ojos y el robot llegan por su cuenta y sin orden garantizado, asi
// que esto se llama desde los dos sitios y solo actua cuando ya estan los dos
function montarCara() {
  if (!hCabeza || !bocas.feliz || !ojos.normal) return;
  if (bocas.feliz.parent !== hCabeza) {
    for (const n in bocas) hCabeza.add(bocas[n]);
    for (const n in ojos) hCabeza.add(ojos[n]);
    const nombreMalla = MESHES.find((n) => parts[n] && parts[n].visible) || MESHES[0];
    colocarBoca(nombreMalla);
    colocarOjos(nombreMalla);
    ponerBoca('feliz');
    ponerOjos('normal');
  }
  aplicarPaleta(model, paleta);   // ya cuelgan del modelo: hay que pintarlas
}

function cargarCaras(url, nombres, destino) {
  new GLTFLoader().load(url, (gltf) => {
    for (const n of nombres) {
      const malla = gltf.scene.getObjectByName(n);
      if (!malla) { fail(`falta '${n}' en ${url}`); continue; }
      malla.castShadow = false;      // es plana y va pegada a la cara
      malla.receiveShadow = false;
      malla.frustumCulled = false;   // cuelga de un hueso: su caja no se recalcula
      malla.visible = false;
      destino[n] = malla;
    }
    montarCara();
  }, undefined, (e) => fail(url + ': ' + e.message));
}

cargarCaras('bocas.glb', ['feliz', 'abierta', 'pensando', 'sorpresa', 'triste'], bocas);
cargarCaras('ojos.glb', ['normal', 'triste', 'guino', 'doble_guino', 'pensando'], ojos);

// cache-bust: robot.glb se reexporta seguido mientras se ajustan poses, y el
// navegador (y a veces el propio server local) lo sirven cacheado sin avisar
new GLTFLoader().load(
  'robot.glb?v=' + Date.now(),
  (gltf) => {
    model = gltf.scene;

    model.traverse((o) => {
      if (!o.isMesh) return;
      o.castShadow = true;
      o.receiveShadow = true;
      // la malla skinned se sale de su bounding box al animarse
      o.frustumCulled = false;

      const mats = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of mats) {
        // contorno por casco invertido: normales ya volteadas al exportar
        if (/outline/i.test(m.name)) {
          m.side = THREE.FrontSide;
          m.polygonOffset = true;
          m.polygonOffsetFactor = 1;
        }
        if (m.name === 'M_lens') { m.transparent = true; m.opacity = 0.22; }
      }
    });

    scene.add(model);

    for (const n of MESHES) parts[n] = model.getObjectByName(n);
    const missing = MESHES.filter((n) => !parts[n]);
    if (missing.length) fail('faltan mallas en robot.glb: ' + missing.join(', '));

    hCabeza = model.getObjectByName('head');
    if (!hCabeza) fail('falta el hueso head en robot.glb: K-7 se queda sin cara');
    montarCara();

    if (gltf.animations.length) {
      mixer = new THREE.AnimationMixer(model);
      for (const clip of gltf.animations) {
        const a = mixer.clipAction(clip);
        if (UNA_VEZ.has(clip.name)) {
          a.setLoop(THREE.LoopOnce);
          a.clampWhenFinished = true;
        }
        a.setEffectiveWeight(clip.name === 'Idle' ? 1 : 0);
        a.play();   // todas corren desde el arranque; el peso decide que se ve
        actions[clip.name] = a;
      }
      activeAction = actions['Idle'] || null;

      // los gestos de una vez vuelven solos a Reposo al terminar
      mixer.addEventListener('finished', (e) => {
        if (UNA_VEZ.has(e.action.getClip().name)) fadeToAction('Idle');
      });
    }

    skeletonHelper = new THREE.SkeletonHelper(model);
    skeletonHelper.visible = false;
    skeletonHelper.material.linewidth = 2;
    scene.add(skeletonHelper);

    // encuadra con las tres mallas visibles: comparten proporciones, asi que
    // el encuadre vale para todas y no hay que recolocar la camara al
    // cambiar de modelo
    aplicarPaleta(model, paleta);

    frame(model);
    showMesh(MESHES[0]);
    setupDevMode();

    loaderEl.classList.add('done');
  },
  (e) => {
    if (e.lengthComputable) barEl.style.width = (e.loaded / e.total * 100) + '%';
  },
  (e) => {
    loaderTxt.textContent =
      'no se pudo cargar el modelo — ¿estás sirviendo la carpeta por HTTP?';
    fail('GLTFLoader: ' + e.message);
  }
);

for (const b of modelBtns) b.addEventListener('click', () => showMesh(b.dataset.mesh));

const animBurger = document.getElementById('anims-burger');
const animMenu = document.getElementById('anims-menu');
animBurger.addEventListener('click', () => {
  const abrir = animMenu.hidden;
  animMenu.hidden = !abrir;
  animBurger.setAttribute('aria-expanded', String(abrir));
});

animBtns.push(...document.querySelectorAll('#anims button, #anims-menu button'));
for (const b of animBtns) b.addEventListener('click', () => {
  fadeToAction(b.dataset.anim);
  animMenu.hidden = true;
  animBurger.setAttribute('aria-expanded', 'false');
});

const toggle = (btn, fn) => btn.addEventListener('click', () => {
  const on = btn.getAttribute('aria-pressed') !== 'true';
  btn.setAttribute('aria-pressed', on);
  fn(on, btn);
});

toggle(btnPlay, (on, b) => {
  b.textContent = on ? 'Pausa' : 'Reanudar';
  paused = !on;
});
toggle(document.getElementById('btn-spin'), (on) => { controls.autoRotate = on; });
toggle(btnBones, (on) => {
  if (skeletonHelper) skeletonHelper.visible = on;
});
document.getElementById('btn-reset').addEventListener('click', resetView);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (mixer && !paused) mixer.update(dt);
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
